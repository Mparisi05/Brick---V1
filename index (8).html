<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brick — time-boxed tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f6f2ec;
    --bg-card:   #ffffff;
    --bg-sunken: #ece6dd;
    --ink:       #1a1715;
    --ink-soft:  #5b524a;
    --ink-faint: #9a8f84;
    --line:      #d9d1c4;
    --line-soft: #e8e1d4;
    --accent:    #b85c38;
    --accent-soft: #e8c2ad;
    --accent-bg:   #f7e6d9;
    --work:      #3d6b8c;
    --work-bg:   #dde8f1;
    --personal:  #6b4a7a;
    --personal-bg: #e6dcec;
    --danger:    #9c2a2a;
    --success:   #3d6b4b;
    --warn:      #b8862a;
    --shadow:    0 1px 2px rgba(26,23,21,0.04), 0 4px 12px rgba(26,23,21,0.06);
    --shadow-lg: 0 4px 16px rgba(26,23,21,0.08), 0 16px 40px rgba(26,23,21,0.10);
    --radius:    10px;
    --radius-sm: 6px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body:    'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* ========= LOGIN ========= */
  .login-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .login-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 40px 36px;
    width: 360px; box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .login-card .brand-mark { margin: 0 auto 20px; }
  .login-card h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 32px; margin: 0 0 6px; letter-spacing: -0.02em;
  }
  .login-card p { color: var(--ink-soft); font-size: 13px; margin: 0 0 24px; }
  .login-card input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg); margin-bottom: 12px;
  }
  .login-card input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .login-card button {
    width: 100%; padding: 11px;
    background: var(--ink); color: var(--bg-card);
    border: none; border-radius: var(--radius-sm);
    font-weight: 600; letter-spacing: 0.01em;
  }
  .login-card button:hover { background: var(--accent); }
  .login-card .err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* ========= APP SHELL ========= */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: var(--bg-card); gap: 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--font-display); font-weight: 600;
    font-size: 22px; letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { display: block; }

  .topbar-center { display: flex; align-items: center; gap: 12px; }

  /* Segmented category filter */
  .seg {
    display: inline-flex; background: var(--bg-sunken);
    border-radius: var(--radius-sm); padding: 3px; gap: 2px;
    border: 1px solid var(--line-soft);
  }
  .seg button {
    background: transparent; border: none;
    padding: 6px 14px; border-radius: 4px;
    color: var(--ink-soft); font-weight: 500; font-size: 12px;
    letter-spacing: 0.02em; transition: all 0.15s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.active {
    background: var(--bg-card); color: var(--ink);
    box-shadow: 0 1px 3px rgba(26,23,21,0.08);
  }
  .seg button.active.work     { color: var(--work); }
  .seg button.active.personal { color: var(--personal); }

  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent; border: 1px solid transparent;
    padding: 7px 14px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-weight: 500; font-size: 13px;
  }
  .tab:hover { color: var(--ink); background: var(--bg-sunken); }
  .tab.active { color: var(--ink); background: var(--bg-sunken); border-color: var(--line); }

  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .sync-status { font-size: 11px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .sync-dot.syncing { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .icon-btn {
    background: transparent; border: 1px solid var(--line);
    padding: 6px 10px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-size: 12px;
  }
  .icon-btn:hover { background: var(--bg-sunken); color: var(--ink); }

  /* ========= QUICK ADD ========= */
  .quick-add {
    padding: 16px 24px; background: var(--bg-card);
    border-bottom: 1px solid var(--line);
  }
  .quick-add-row {
    display: flex; gap: 8px; align-items: center;
    max-width: 1200px; margin: 0 auto; flex-wrap: wrap;
  }
  .quick-add input[type="text"] {
    flex: 1; min-width: 220px; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg);
  }
  .quick-add input:focus, .quick-add select:focus {
    outline: 2px solid var(--accent-soft); border-color: var(--accent);
  }
  .quick-add select, .quick-add input[type="date"] {
    padding: 10px 12px; border: 1px solid var(--line);
    border-radius: var(--radius-sm); background: var(--bg); color: var(--ink);
  }
  .qa-seg {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px;
  }
  .qa-seg button {
    background: transparent; border: none;
    padding: 6px 12px; border-radius: 4px;
    color: var(--ink-soft); font-weight: 500; font-size: 12px;
  }
  .qa-seg button.active.work     { background: var(--work-bg); color: var(--work); }
  .qa-seg button.active.personal { background: var(--personal-bg); color: var(--personal); }

  .quick-add button.submit {
    padding: 10px 18px; background: var(--accent); color: white;
    border: none; border-radius: var(--radius-sm); font-weight: 600;
  }
  .quick-add button.submit:hover { background: #a04e2e; }
  .quick-add button.submit:disabled { background: var(--ink-faint); cursor: not-allowed; }

  /* ========= MAIN CONTENT ========= */
  .main { flex: 1; overflow: auto; padding: 24px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ========= TOTALS BAR (Board view) ========= */
  .totals-bar {
    display: flex; gap: 12px; margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .total-card {
    flex: 1; min-width: 160px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 16px;
    display: flex; align-items: baseline; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .total-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .total-card.all::before      { background: var(--accent); }
  .total-card.work::before     { background: var(--work); }
  .total-card.personal::before { background: var(--personal); }
  .total-label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600;
  }
  .total-value {
    font-family: var(--font-display); font-weight: 600;
    font-size: 22px; letter-spacing: -0.01em; color: var(--ink);
  }
  .total-meta {
    font-size: 11px; color: var(--ink-faint); margin-top: 2px;
  }
  .total-card .total-stack { display: flex; flex-direction: column; gap: 0; }

  /* Urgency view: time pill in column header */
  .col-time {
    font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
    background: var(--bg-card); padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--line-soft);
  }
  .urgency .col-head { gap: 6px; flex-wrap: wrap; }

  /* ========= BOARD / URGENCY GRID ========= */
  .board {
    display: grid;
    grid-template-columns: repeat(7, minmax(160px, 1fr));
    gap: 14px;
  }
  .urgency {
    display: grid;
    grid-template-columns: repeat(5, minmax(200px, 1fr));
    gap: 14px;
  }
  .col {
    background: var(--bg-sunken); border-radius: var(--radius);
    padding: 12px; min-height: 200px;
    border: 1px solid var(--line-soft);
    transition: background 0.15s, border-color 0.15s;
  }
  .col.drag-target { background: var(--accent-bg); border-color: var(--accent); }
  .col-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px; padding: 0 4px;
  }
  .col-label {
    font-family: var(--font-display); font-weight: 600;
    font-size: 15px; color: var(--ink); letter-spacing: -0.01em;
  }
  .urgency .col-label.overdue { color: var(--danger); }
  .urgency .col-label.today   { color: var(--warn); }
  .col-count { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .col-tasks { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }

  /* ========= TASK TILE ========= */
  .task-tile {
    background: var(--bg-card); border-radius: var(--radius-sm);
    padding: 10px 12px; border: 1px solid var(--line);
    cursor: grab; transition: box-shadow 0.12s, border-color 0.12s, opacity 0.12s;
    position: relative;
  }
  .task-tile:hover { box-shadow: var(--shadow); border-color: var(--accent-soft); }
  .task-tile:active { cursor: grabbing; }
  .task-tile.dragging { opacity: 0.35; }
  .task-tile.drop-above { box-shadow: -3px -3px 0 var(--accent) inset, 0 -3px 0 var(--accent); }
  .task-tile.drop-below { box-shadow: 0 3px 0 var(--accent); }
  .task-tile.completed { opacity: 0.55; background: var(--bg); }
  .task-tile.completed .task-name { text-decoration: line-through; color: var(--ink-faint); }
  /* Category-driven background tints */
  .task-tile.cat-personal { background: #f3edf6; border-color: #d9cde2; }
  .task-tile.cat-personal:hover { border-color: var(--personal); }
  .task-tile.cat-personal.completed { background: #ebe4ef; }
  /* Category accent stripe on left edge */
  .task-tile::before {
    content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 3px; border-radius: 2px;
  }
  .task-tile.cat-work::before     { background: var(--work); }
  .task-tile.cat-personal::before { background: var(--personal); }

  .task-head { display: flex; align-items: flex-start; gap: 8px; padding-left: 8px; }
  .task-check {
    width: 16px; height: 16px; border: 1.5px solid var(--line);
    border-radius: 4px; flex-shrink: 0; margin-top: 2px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-card); cursor: pointer;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-check.checked::after { content: '✓'; color: white; font-size: 11px; line-height: 1; }
  .task-name { font-size: 13px; font-weight: 500; line-height: 1.35; word-break: break-word; flex: 1; cursor: pointer; }
  .task-meta {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 8px; padding-left: 32px;
    font-size: 11px; color: var(--ink-soft);
  }
  .task-pill {
    background: var(--bg-sunken); padding: 2px 7px;
    border-radius: 10px; font-size: 10px; letter-spacing: 0.02em;
  }
  .task-pill.project { background: var(--accent-bg); color: var(--accent); }
  .task-pill.due.overdue { background: #f4d8d8; color: var(--danger); }
  .task-pill.due.today { background: #fbe9c8; color: var(--warn); }

  /* ========= PROJECTS VIEW ========= */
  .projects-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .project-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow); position: relative;
  }
  .project-card::before {
    content: ''; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 2px;
  }
  .project-card.cat-work::before     { background: var(--work); }
  .project-card.cat-personal::before { background: var(--personal); }

  .project-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-left: 8px; }
  .project-name {
    font-family: var(--font-display); font-weight: 600;
    font-size: 19px; letter-spacing: -0.01em; margin: 0;
  }
  .project-cat-label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600;
  }
  .project-actions { display: flex; gap: 4px; }
  .project-actions button {
    background: transparent; border: none; padding: 4px 6px;
    color: var(--ink-faint); border-radius: 4px; font-size: 13px;
  }
  .project-actions button:hover { background: var(--bg-sunken); color: var(--ink); }

  .progress-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; padding-left: 8px; }
  .progress-track { flex: 1; height: 6px; background: var(--bg-sunken); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .progress-label { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .project-stats {
    display: flex; gap: 14px; font-size: 11px; color: var(--ink-faint);
    margin-bottom: 10px; padding-left: 8px;
  }
  .project-stats strong { color: var(--ink-soft); font-weight: 600; }

  .project-tasks-toggle {
    background: transparent; border: 1px solid var(--line);
    padding: 6px 10px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-size: 12px; width: 100%;
    text-align: left; margin-top: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .project-tasks-toggle:hover { background: var(--bg-sunken); }
  .project-tasks-toggle .toggle-label { display: flex; align-items: center; gap: 6px; }
  .project-tasks-toggle .toggle-label::before {
    content: '▸'; display: inline-block; transition: transform 0.2s;
    font-size: 10px; color: var(--ink-faint);
  }
  .project-tasks-toggle.open .toggle-label::before { transform: rotate(90deg); }
  .project-tasks-toggle .toggle-count {
    color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 11px;
  }
  .project-tasks-toggle.completed-section .toggle-label { color: var(--ink-faint); }

  .project-tasks { margin-top: 8px; display: none; }
  .project-tasks.open { display: flex; flex-direction: column; gap: 6px; }
  .project-tasks .task-tile { cursor: default; }

  .new-project-card {
    background: transparent; border: 1.5px dashed var(--line);
    border-radius: var(--radius); padding: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); font-size: 13px;
    min-height: 140px; cursor: pointer; transition: all 0.15s;
  }
  .new-project-card:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  /* ========= PROJECTS SUBNAV ========= */
  .projects-subnav { margin-bottom: 16px; }

  /* ========= PRIORITY VIEW ========= */
  .priority-intro {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
    font-size: 12px; color: var(--ink-soft);
  }
  .priority-intro code {
    background: var(--bg-sunken); padding: 1px 6px; border-radius: 4px;
    font-size: 11px; color: var(--ink);
  }
  .priority-list { display: flex; flex-direction: column; gap: 8px; }
  .priority-row {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
    position: relative;
  }
  .priority-row::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; border-radius: 2px;
  }
  .priority-row.cat-work::before     { background: var(--work); }
  .priority-row.cat-personal::before { background: var(--personal); }
  .priority-row.cat-personal { background: #f3edf6; border-color: #d9cde2; }
  .priority-rank {
    font-family: var(--font-display); font-weight: 600;
    font-size: 20px; color: var(--ink-faint);
    min-width: 32px; text-align: center;
  }
  .priority-row:nth-child(1) .priority-rank,
  .priority-row:nth-child(2) .priority-rank,
  .priority-row:nth-child(3) .priority-rank { color: var(--accent); }
  .priority-main { flex: 1; min-width: 0; }
  .priority-check {
    width: 16px; height: 16px; border: 1.5px solid var(--line);
    border-radius: 4px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-card); cursor: pointer;
  }
  .priority-check:hover { border-color: var(--accent); }
  .priority-name {
    font-size: 14px; font-weight: 500; cursor: pointer;
    display: block; line-height: 1.3;
  }
  .priority-name:hover { color: var(--accent); }
  .priority-sub {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-top: 4px; font-size: 11px; color: var(--ink-faint);
  }
  .priority-sub .task-pill { font-size: 10px; }
  .priority-score-box { text-align: right; flex-shrink: 0; }
  .priority-score {
    font-family: var(--font-display); font-weight: 600;
    font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .priority-formula { font-size: 10px; color: var(--ink-faint); margin-top: 2px; }
  .priority-section-label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600;
    margin: 18px 0 6px; padding-left: 4px;
  }
  .priority-section-label:first-child { margin-top: 0; }

  /* Project card money stats */
  .project-money {
    display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap;
    padding-left: 8px; margin: 4px 0 0;
    font-size: 12px; color: var(--ink-soft);
  }
  .project-money .ev {
    font-weight: 600; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .project-money .raw { color: var(--ink-faint); font-size: 11px; }

  /* ========= DONE VIEW ========= */
  .done-controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .done-controls input[type="date"] {
    padding: 7px 10px; border: 1px solid var(--line);
    border-radius: var(--radius-sm); background: var(--bg-card); color: var(--ink);
    font-size: 13px;
  }
  .done-nav-btn {
    background: var(--bg-card); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-size: 13px;
  }
  .done-nav-btn:hover { background: var(--bg-sunken); color: var(--ink); }
  .done-range-label {
    font-family: var(--font-display); font-weight: 600;
    font-size: 16px; letter-spacing: -0.01em; margin-left: 4px;
  }
  .done-summary {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
    display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap;
  }
  .done-summary .big {
    font-family: var(--font-display); font-weight: 600; font-size: 22px;
  }
  .done-summary .sub { font-size: 12px; color: var(--ink-soft); }
  .done-list { display: flex; flex-direction: column; gap: 8px; }
  .done-row {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 10px 14px;
    display: flex; align-items: center; gap: 12px;
    position: relative;
  }
  .done-row::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; border-radius: 2px;
  }
  .done-row.cat-work::before     { background: var(--work); }
  .done-row.cat-personal::before { background: var(--personal); }
  .done-row.cat-personal { background: #f3edf6; border-color: #d9cde2; }
  .done-row .done-check {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    background: var(--success); color: white;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .done-row .done-name { flex: 1; font-size: 13px; font-weight: 500; }
  .done-row .done-meta {
    display: flex; gap: 8px; align-items: center;
    font-size: 11px; color: var(--ink-faint); flex-shrink: 0;
  }
  .done-group-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 14px 0 4px; padding: 0 4px;
  }
  .done-group-head:first-child { margin-top: 0; }
  .done-group-name {
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
  }
  .done-group-total {
    font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }

  /* ========= TO-DO VIEW ========= */
  .todo-controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .todo-controls .flex-spacer { flex: 1; }
  .todo-clear-btn {
    background: var(--bg-card); border: 1px solid var(--danger);
    color: var(--danger); padding: 7px 14px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 600;
  }
  .todo-clear-btn:hover { background: var(--danger); color: white; }
  .todo-breakdowns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-bottom: 16px;
  }
  .breakdown-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .breakdown-card h4 {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600; margin: 0 0 10px;
  }
  .breakdown-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0; font-size: 13px;
    border-bottom: 1px solid var(--line-soft);
  }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-row .label { color: var(--ink); }
  .breakdown-row .value { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* To-do rows reuse priority-row but add drag affordances */
  .priority-list .priority-row[draggable="true"] { cursor: grab; }
  .priority-list .priority-row[draggable="true"]:active { cursor: grabbing; }
  .priority-row.dragging { opacity: 0.35; }
  .priority-row.drop-above { box-shadow: 0 -3px 0 var(--accent); }
  .priority-row.drop-below { box-shadow: 0 3px 0 var(--accent); }

  /* Star button on task tiles and priority rows */
  .todo-star {
    background: transparent; border: none; padding: 2px 4px;
    color: var(--ink-faint); font-size: 15px; cursor: pointer;
    border-radius: 4px; line-height: 1;
  }
  .todo-star:hover { color: var(--warn); background: var(--bg-sunken); }
  .todo-star.active { color: var(--warn); }
  .task-tile .todo-star {
    position: absolute; top: 6px; right: 6px;
  }
  .priority-row .todo-star { padding: 4px 8px; font-size: 16px; }

  /* Confirmation modal (distinct from regular modal) */
  .confirm-modal p {
    color: var(--ink-soft); font-size: 14px; margin: 0 0 6px;
  }
  .confirm-modal p.detail { color: var(--ink-faint); font-size: 12px; margin: 0 0 20px; }

  @media (max-width: 700px) {
    .todo-breakdowns { grid-template-columns: 1fr; }
  }

  /* ========= MODAL ========= */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(26,23,21,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 500; animation: fadein 0.15s;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-card); border-radius: var(--radius);
    padding: 28px; width: 440px; max-width: 90vw;
    box-shadow: var(--shadow-lg);
  }
  .modal h2 {
    font-family: var(--font-display); font-weight: 600;
    margin: 0 0 18px; font-size: 22px; letter-spacing: -0.01em;
  }
  .modal p.hint { color: var(--ink-soft); font-size: 13px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; color: var(--ink-soft);
    margin-bottom: 5px; font-weight: 500; letter-spacing: 0.02em;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px;
  }
  .modal-actions button {
    padding: 9px 18px; border-radius: var(--radius-sm);
    font-weight: 600; border: 1px solid var(--line); background: var(--bg-card);
  }
  .modal-actions button.primary {
    background: var(--ink); color: var(--bg-card); border-color: var(--ink);
  }
  .modal-actions button.primary:hover { background: var(--accent); border-color: var(--accent); }
  .modal-actions button.danger { background: var(--danger); color: white; border-color: var(--danger); }
  .modal-actions button.secondary:hover { background: var(--bg-sunken); }

  /* ========= EMPTY STATES ========= */
  .empty { text-align: center; padding: 20px; color: var(--ink-faint); font-size: 12px; }
  .empty-board {
    grid-column: 1 / -1; text-align: center;
    padding: 60px 20px; color: var(--ink-faint);
  }
  .empty-board h3 {
    font-family: var(--font-display); font-weight: 500;
    font-size: 20px; color: var(--ink-soft); margin: 0 0 8px;
  }

  /* ========= RESPONSIVE ========= */
  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .urgency { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  }
  @media (max-width: 700px) {
    .topbar { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
    .brand { font-size: 18px; }
    .topbar-center { width: 100%; flex-wrap: wrap; justify-content: center; }
    .tabs { order: 3; width: 100%; justify-content: center; }
    .quick-add { padding: 12px 14px; }
    .quick-add-row { gap: 6px; }
    .main { padding: 14px; }
    .board, .urgency { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark" style="width:44px;height:44px;">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="22" width="16" height="10" rx="2" fill="#b85c38"/>
        <rect x="22" y="22" width="10" height="10" rx="2" fill="#1a1715"/>
        <rect x="4" y="10" width="10" height="10" rx="2" fill="#1a1715"/>
        <rect x="16" y="10" width="22" height="10" rx="2" fill="#b85c38"/>
      </svg>
    </div>
    <h1>Brick</h1>
    <p>Time-boxed tasks, stacked.</p>
    <input id="passcodeInput" type="password" placeholder="Enter passcode" autocomplete="off" />
    <button id="loginBtn">Enter</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="app" style="display:none;">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="22" width="16" height="10" rx="2" fill="#b85c38"/>
          <rect x="22" y="22" width="10" height="10" rx="2" fill="#1a1715"/>
          <rect x="4" y="10" width="10" height="10" rx="2" fill="#1a1715"/>
          <rect x="16" y="10" width="22" height="10" rx="2" fill="#b85c38"/>
        </svg>
      </span>
      Brick
    </div>

    <div class="topbar-center">
      <div class="seg" id="categoryFilter">
        <button data-cat="all" class="active">All</button>
        <button data-cat="work">Work</button>
        <button data-cat="personal">Personal</button>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="board">Board</button>
        <button class="tab" data-view="urgency">Urgency</button>
        <button class="tab" data-view="priority">Priority</button>
        <button class="tab" data-view="todo">To-Do</button>
        <button class="tab" data-view="projects">Projects</button>
        <button class="tab" data-view="done">Done</button>
      </nav>
    </div>

    <div class="topbar-right">
      <div class="sync-status">
        <span id="syncDot" class="sync-dot"></span>
        <span id="syncText">Synced</span>
      </div>
      <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
      <button class="icon-btn" id="logoutBtn" title="Log out">⏻</button>
    </div>
  </header>

  <section class="quick-add">
    <div class="quick-add-row">
      <input type="text" id="qaName" placeholder="Add a task and press Enter…" />
      <div class="qa-seg" id="qaCategory">
        <button data-cat="work" class="active work">Work</button>
        <button data-cat="personal" class="personal">Personal</button>
      </div>
      <select id="qaMinutes" title="Time">
        <option value="">No time</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
        <option value="120">2 hr (splits)</option>
        <option value="180">3 hr (splits)</option>
        <option value="240">4 hr (splits)</option>
      </select>
      <select id="qaProject" title="Project">
        <option value="">No project</option>
      </select>
      <input type="date" id="qaDue" title="Due date" />
      <button class="submit" id="qaSubmit">Add</button>
    </div>
  </section>

  <main class="main">
    <section id="view-board" class="view active">
      <div class="totals-bar" id="totalsBarEl"></div>
      <div class="board" id="boardEl"></div>
    </section>
    <section id="view-urgency" class="view"><div class="urgency" id="urgencyEl"></div></section>
    <section id="view-priority" class="view">
      <div class="priority-intro" id="priorityIntroEl"></div>
      <div class="priority-list" id="priorityEl"></div>
    </section>
    <section id="view-todo" class="view">
      <div class="todo-controls" id="todoControlsEl"></div>
      <div class="totals-bar" id="todoTotalsEl"></div>
      <div class="todo-breakdowns" id="todoBreakdownsEl"></div>
      <div class="priority-list" id="todoListEl"></div>
    </section>
    <section id="view-projects" class="view">
      <div class="projects-subnav">
        <div class="seg" id="projectStatusToggle">
          <button data-status="active" class="active">Active</button>
          <button data-status="completed">Completed</button>
        </div>
      </div>
      <div class="projects-grid" id="projectsEl"></div>
    </section>
    <section id="view-done" class="view">
      <div class="done-controls" id="doneControlsEl"></div>
      <div class="done-summary" id="doneSummaryEl"></div>
      <div class="done-list" id="doneEl"></div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
   CONFIG — set this to your deployed Apps Script Web App URL
   ============================================================ */
const API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  tasks: [],
  projects: [],
  archivedTasks: [],
  archivedProjects: [],
  view: 'board',
  category: localStorage.getItem('brick_category') || 'all',     // all | work | personal
  projectStatusFilter: 'active',                                   // active | completed
  qaCategory: localStorage.getItem('brick_qa_category') || 'work', // default for new tasks
  passcode: localStorage.getItem('brick_passcode') || '',
  // Done view: 'day' | 'week'; anchor date (YYYY-MM-DD); grouping 'time' | 'project'
  doneMode: 'day',
  doneDate: null,           // set at init to today
  doneGroup: 'time',
  // To-Do view: 'auto' (priority score) | 'manual' (TodoOrder)
  todoSort: localStorage.getItem('brick_todo_sort') || 'auto',
  // Tracks which per-project sections are expanded. Keys are of the form
  // "projectId:open" or "projectId:completed". Default: only open sections visible.
  expandedSections: new Set(JSON.parse(localStorage.getItem('brick_sections') || '[]'))
};

const BUCKETS = [null, 5, 10, 15, 30, 60, 90];
const BUCKET_LABELS = { 'null': 'Unsized', '5': '5 min', '10': '10 min', '15': '15 min', '30': '30 min', '60': '60 min', '90': '90 min' };

/* ============================================================
   API
   ============================================================ */
async function api(action, params = {}) {
  setSync('syncing');
  try {
    const body = new URLSearchParams({ action, passcode: state.passcode, ...params });
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
      redirect: 'follow'
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Unknown error');
    setSync('synced');
    return json.data;
  } catch (err) {
    setSync('error', err.message);
    throw err;
  }
}

function setSync(status, msg) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if (!dot || !txt) return;
  dot.classList.remove('syncing', 'error');
  if (status === 'syncing') { dot.classList.add('syncing'); txt.textContent = 'Syncing…'; }
  else if (status === 'error') { dot.classList.add('error'); txt.textContent = 'Error'; txt.title = msg || ''; }
  else { txt.textContent = 'Synced'; txt.title = ''; }
}

/* ============================================================
   LOGIN
   ============================================================ */
function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('passcodeInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') tryLogin();
});

async function tryLogin() {
  const code = document.getElementById('passcodeInput').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if (!code) { errEl.textContent = 'Enter a passcode.'; return; }
  state.passcode = code;
  try {
    await api('list');
    localStorage.setItem('brick_passcode', code);
    showApp();
    await refresh();
  } catch (err) {
    state.passcode = '';
    errEl.textContent = err.message.includes('Unauthorized') ? 'Wrong passcode.' : err.message;
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('brick_passcode');
  state.passcode = '';
  showLogin();
});

/* ============================================================
   REFRESH / RENDER
   ============================================================ */
async function refresh() {
  const data = await api('list');
  state.tasks = data.tasks || [];
  state.projects = data.projects || [];
  state.archivedTasks = data.archivedTasks || [];
  state.archivedProjects = data.archivedProjects || [];
  renderAll();
}

function renderAll() {
  applyCategoryClassToBody();
  renderProjectSelect();
  renderTotalsBar();
  renderBoard();
  renderUrgency();
  renderPriority();
  renderTodo();
  renderProjects();
  renderDone();
}

function renderTotalsBar() {
  const el = document.getElementById('totalsBarEl');
  if (!el) return;
  // ALWAYS show all three totals regardless of master filter
  const all      = sumOpenMinutes(state.tasks);
  const work     = sumOpenMinutes(state.tasks.filter(t => normalizeCategory(t.Category) === 'work'));
  const personal = sumOpenMinutes(state.tasks.filter(t => normalizeCategory(t.Category) === 'personal'));

  const card = (cls, label, data) => {
    const untimedNote = data.untimed > 0 ? ` <span style="color:var(--ink-faint);font-weight:400;">(+${data.untimed} untimed)</span>` : '';
    return `
      <div class="total-card ${cls}">
        <div class="total-stack">
          <span class="total-label">${label}</span>
          <span class="total-value">${formatMinutes(data.total)}</span>
        </div>
        <span class="total-meta">${untimedNote}</span>
      </div>
    `;
  };

  el.innerHTML = card('all', 'All open', all) + card('work', 'Work', work) + card('personal', 'Personal', personal);
}

function applyCategoryClassToBody() {
  document.querySelectorAll('#categoryFilter button').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === state.category);
    b.classList.toggle('work', b.dataset.cat === 'work' && b.classList.contains('active'));
    b.classList.toggle('personal', b.dataset.cat === 'personal' && b.classList.contains('active'));
  });
}

document.getElementById('refreshBtn').addEventListener('click', refresh);

/* ============================================================
   FILTERS — Category & View
   ============================================================ */
document.querySelectorAll('#categoryFilter button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.category = btn.dataset.cat;
    localStorage.setItem('brick_category', state.category);
    // When you switch the master filter to Work or Personal, the quick-add defaults follow
    if (state.category === 'work' || state.category === 'personal') {
      state.qaCategory = state.category;
      localStorage.setItem('brick_qa_category', state.qaCategory);
      syncQaCategoryUI();
    }
    renderAll();
  });
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    state.view = t.dataset.view;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + state.view).classList.add('active');
  });
});

// Projects view: Active / Completed toggle
document.querySelectorAll('#projectStatusToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.projectStatusFilter = btn.dataset.status;
    document.querySelectorAll('#projectStatusToggle button').forEach(b =>
      b.classList.toggle('active', b.dataset.status === state.projectStatusFilter));
    renderProjects();
  });
});

/* ============================================================
   QUICK ADD — category, project, time, due
   ============================================================ */
function syncQaCategoryUI() {
  document.querySelectorAll('#qaCategory button').forEach(b => {
    const active = b.dataset.cat === state.qaCategory;
    b.classList.toggle('active', active);
    b.classList.toggle('work', b.dataset.cat === 'work');
    b.classList.toggle('personal', b.dataset.cat === 'personal');
  });
}
syncQaCategoryUI();

document.querySelectorAll('#qaCategory button').forEach(b => {
  b.addEventListener('click', () => {
    state.qaCategory = b.dataset.cat;
    localStorage.setItem('brick_qa_category', state.qaCategory);
    syncQaCategoryUI();
  });
});

function renderProjectSelect() {
  const sel = document.getElementById('qaProject');
  const current = sel.value;
  // Filter project list by current quick-add category (so you only pick a project from the matching world)
  const projects = state.projects
    .filter(p => p.Status !== 'completed')
    .filter(p => normalizeCategory(p.Category) === state.qaCategory);
  sel.innerHTML = '<option value="">No project</option>' +
    projects.map(p => `<option value="${escapeAttr(p.ProjectID)}">${escapeHtml(p.ProjectName)}</option>`).join('');
  if (current && projects.find(p => p.ProjectID === current)) sel.value = current;
}

document.getElementById('qaSubmit').addEventListener('click', quickAdd);
document.getElementById('qaName').addEventListener('keypress', e => {
  if (e.key === 'Enter') quickAdd();
});

async function quickAdd() {
  const name = document.getElementById('qaName').value.trim();
  if (!name) return;
  const minutes = document.getElementById('qaMinutes').value;
  const projectId = document.getElementById('qaProject').value;
  const dueDate = document.getElementById('qaDue').value;
  const category = state.qaCategory;

  const btn = document.getElementById('qaSubmit');
  btn.disabled = true;
  try {
    await api('addTask', { taskName: name, category, minutes, projectId, dueDate });
    document.getElementById('qaName').value = '';
    document.getElementById('qaMinutes').value = '';
    document.getElementById('qaDue').value = '';
    await refresh();
    document.getElementById('qaName').focus();
  } catch (err) {
    alert('Could not add task: ' + err.message);
  } finally {
    btn.disabled = false;
  }
}

// Switching the quick-add project should constrain to the project's category
document.getElementById('qaProject').addEventListener('change', () => {
  const pid = document.getElementById('qaProject').value;
  if (!pid) return;
  const p = state.projects.find(x => x.ProjectID === pid);
  if (p && p.Category && normalizeCategory(p.Category) !== state.qaCategory) {
    state.qaCategory = normalizeCategory(p.Category);
    localStorage.setItem('brick_qa_category', state.qaCategory);
    syncQaCategoryUI();
  }
});

/* ============================================================
   FILTERED COLLECTIONS
   ============================================================ */
function visibleTasks() {
  if (state.category === 'all') return state.tasks;
  return state.tasks.filter(t => normalizeCategory(t.Category) === state.category);
}
function visibleProjects() {
  if (state.category === 'all') return state.projects;
  return state.projects.filter(p => normalizeCategory(p.Category) === state.category);
}

/* ============================================================
   BOARD VIEW (time buckets)
   ============================================================ */
function renderBoard() {
  const el = document.getElementById('boardEl');
  // Completed tasks don't appear on the Board — they live in the Done tab
  // and in each project's Completed section.
  const tasks = visibleTasks().filter(t => t.Status !== 'completed');

  if (tasks.length === 0) {
    el.innerHTML = `<div class="empty-board">
      <h3>Nothing here yet.</h3>
      <p>Add a task above to get started${state.category !== 'all' ? ` in <strong>${state.category}</strong>` : ''}.</p>
    </div>`;
    return;
  }

  el.innerHTML = BUCKETS.map(bucket => {
    const inBucket = tasks
      .filter(t => taskBucket(t) === bucket)
      .sort((a, b) => (parseInt(a.SortOrder, 10) || 0) - (parseInt(b.SortOrder, 10) || 0));
    return `
      <div class="col" data-bucket="${bucket === null ? '' : bucket}">
        <div class="col-head">
          <span class="col-label">${BUCKET_LABELS[String(bucket)]}</span>
          <span class="col-count">${inBucket.length}</span>
        </div>
        <div class="col-tasks" data-bucket="${bucket === null ? '' : bucket}">
          ${inBucket.map(renderTaskTile).join('') || '<div class="empty">—</div>'}
        </div>
      </div>
    `;
  }).join('');

  bindTaskTileEvents();
  bindBoardDnD();
}

function taskBucket(t) {
  const m = parseInt(t.Minutes, 10);
  if (!m || isNaN(m)) return null;
  return m;
}

function renderTaskTile(t) {
  const project = state.projects.find(p => p.ProjectID === t.ProjectID);
  const due = t.DueDate ? new Date(t.DueDate) : null;
  let dueClass = '';
  let dueLabel = '';
  if (due && !isNaN(due)) {
    const today = startOfDay(new Date());
    const dueDay = startOfDay(due);
    const diff = (dueDay - today) / 86400000;
    if (diff < 0) dueClass = 'overdue';
    else if (diff === 0) dueClass = 'today';
    dueLabel = formatShortDate(due);
  }
  const completed = t.Status === 'completed';
  const cat = normalizeCategory(t.Category) || 'work';
  const onTodo = !!t.OnTodoList;
  return `
    <div class="task-tile cat-${cat} ${completed ? 'completed' : ''}" draggable="true" data-id="${escapeAttr(t.TaskID)}">
      ${completed ? '' : `<button class="todo-star ${onTodo ? 'active' : ''}" data-action="star" data-id="${escapeAttr(t.TaskID)}" title="${onTodo ? 'Remove from To-Do' : 'Add to To-Do'}">${onTodo ? '★' : '☆'}</button>`}
      <div class="task-head">
        <span class="task-check ${completed ? 'checked' : ''}" data-action="toggle" data-id="${escapeAttr(t.TaskID)}"></span>
        <span class="task-name" data-action="edit" data-id="${escapeAttr(t.TaskID)}">${escapeHtml(t.TaskName)}</span>
      </div>
      ${(project || dueLabel) ? `
        <div class="task-meta">
          ${project ? `<span class="task-pill project">${escapeHtml(project.ProjectName)}</span>` : ''}
          ${dueLabel ? `<span class="task-pill due ${dueClass}">${dueLabel}</span>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function bindTaskTileEvents(scope) {
  // scope is a DOM element to restrict the bindings to — defaults to document
  // so old call sites still work, but every render function passes its own container.
  const root = scope || document;
  root.querySelectorAll('[data-action="toggle"]').forEach(el => {
    // Skip if we've already bound this one (guards against accidental re-runs)
    if (el.dataset.bound === '1') return;
    el.dataset.bound = '1';
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.id;
      const t = state.tasks.find(x => x.TaskID === id);
      if (!t) return;
      if (t.Status === 'completed') uncompleteTaskFlow(t);
      else completeTaskFlow(t);
    });
  });
  root.querySelectorAll('[data-action="edit"]').forEach(el => {
    if (el.dataset.bound === '1') return;
    el.dataset.bound = '1';
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.id;
      const t = state.tasks.find(x => x.TaskID === id);
      if (t) openTaskModal(t);
    });
  });
  root.querySelectorAll('[data-action="star"]').forEach(el => {
    if (el.dataset.bound === '1') return;
    el.dataset.bound = '1';
    el.addEventListener('click', e => {
      e.stopPropagation();
      const t = state.tasks.find(x => x.TaskID === el.dataset.id);
      if (t) toggleTodo(t);
    });
  });
}

async function toggleTodo(t) {
  const on = !t.OnTodoList;
  // Optimistic UI: flip locally, re-render, then persist
  t.OnTodoList = on ? 'yes' : '';
  if (on) t.TodoOrder = Date.now();
  renderAll();
  try {
    await api('setTodo', { taskId: t.TaskID, on: on ? '1' : '0' });
  } catch (err) {
    alert('Could not update To-Do list: ' + err.message);
    await refresh();
  }
}

/* ============================================================
   DRAG & DROP (Board view only)
   ============================================================ */
let dragId = null;

function bindBoardDnD() {
  document.querySelectorAll('#boardEl .task-tile').forEach(tile => {
    tile.addEventListener('dragstart', e => {
      dragId = tile.dataset.id;
      tile.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });
    tile.addEventListener('dragend', () => {
      tile.classList.remove('dragging');
      document.querySelectorAll('.task-tile').forEach(x => x.classList.remove('drop-above', 'drop-below'));
      document.querySelectorAll('.col').forEach(c => c.classList.remove('drag-target'));
      dragId = null;
    });
    tile.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragId || tile.dataset.id === dragId) return;
      const rect = tile.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      document.querySelectorAll('.task-tile').forEach(x => x.classList.remove('drop-above', 'drop-below'));
      tile.classList.add(above ? 'drop-above' : 'drop-below');
    });
    tile.addEventListener('drop', async e => {
      e.preventDefault();
      e.stopPropagation();
      if (!dragId || tile.dataset.id === dragId) return;
      const rect = tile.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      const targetCol = tile.closest('.col-tasks');
      await handleDrop(dragId, targetCol, tile.dataset.id, above);
    });
  });

  document.querySelectorAll('#boardEl .col-tasks').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      col.closest('.col').classList.add('drag-target');
    });
    col.addEventListener('dragleave', e => {
      // only remove if leaving the column entirely
      if (!col.contains(e.relatedTarget)) col.closest('.col').classList.remove('drag-target');
    });
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.closest('.col').classList.remove('drag-target');
      // If we dropped on the column itself (not on a tile), append to the end
      if (e.target === col || e.target.classList.contains('empty')) {
        await handleDrop(dragId, col, null, false);
      }
    });
  });
}

async function handleDrop(taskId, targetCol, referenceId, dropAbove) {
  if (!taskId || !targetCol) return;
  const newBucketAttr = targetCol.dataset.bucket;
  const newBucket = newBucketAttr === '' ? null : parseInt(newBucketAttr, 10);

  // Collect target column's current task IDs in display order
  const idsInCol = Array.from(targetCol.querySelectorAll('.task-tile')).map(el => el.dataset.id);
  // Remove the dragged task from this list if it's there (cross-position move within same col)
  const filtered = idsInCol.filter(id => id !== taskId);
  // Insert dragged task at correct position
  let insertAt;
  if (referenceId === null) {
    insertAt = filtered.length; // end of column
  } else {
    const refIdx = filtered.indexOf(referenceId);
    insertAt = refIdx === -1 ? filtered.length : (dropAbove ? refIdx : refIdx + 1);
  }
  const newOrder = [...filtered.slice(0, insertAt), taskId, ...filtered.slice(insertAt)];

  // Generate new SortOrder values (spaced by 1000 to leave room for future inserts)
  const updates = newOrder.map((id, i) => {
    const upd = { taskId: id, sortOrder: (i + 1) * 1000 };
    if (id === taskId) upd.minutes = newBucket === null ? '' : newBucket;
    return upd;
  });

  // Optimistic local update so UI feels instant
  updates.forEach(u => {
    const t = state.tasks.find(x => x.TaskID === u.taskId);
    if (t) {
      t.SortOrder = u.sortOrder;
      if (u.minutes !== undefined) t.Minutes = u.minutes === '' ? '' : u.minutes;
    }
  });
  renderBoard();

  try {
    await api('reorderTasks', { order: JSON.stringify(updates) });
  } catch (err) {
    alert('Could not save new order: ' + err.message);
    await refresh();
  }
}

/* ============================================================
   URGENCY VIEW
   ============================================================ */
function renderUrgency() {
  const el = document.getElementById('urgencyEl');
  const today = startOfDay(new Date());
  const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate() + 7);

  const buckets = { overdue: [], today: [], week: [], later: [], none: [] };
  visibleTasks().filter(t => t.Status !== 'completed').forEach(t => {
    if (!t.DueDate) { buckets.none.push(t); return; }
    const d = new Date(t.DueDate);
    if (isNaN(d)) { buckets.none.push(t); return; }
    const day = startOfDay(d);
    if (day < today) buckets.overdue.push(t);
    else if (day.getTime() === today.getTime()) buckets.today.push(t);
    else if (day <= weekEnd) buckets.week.push(t);
    else buckets.later.push(t);
  });

  Object.keys(buckets).forEach(k => buckets[k].sort((a,b) => {
    const da = new Date(a.DueDate); const db = new Date(b.DueDate);
    return (isNaN(da) ? 0 : da) - (isNaN(db) ? 0 : db);
  }));

  const cols = [
    { key: 'overdue', label: 'Overdue', className: 'overdue' },
    { key: 'today',   label: 'Today',   className: 'today' },
    { key: 'week',    label: 'This Week' },
    { key: 'later',   label: 'Later' },
    { key: 'none',    label: 'No Date' }
  ];

  el.innerHTML = cols.map(c => {
    const colSum = sumOpenMinutes(buckets[c.key]);
    const timeBadge = colSum.total > 0 || colSum.untimed > 0
      ? `<span class="col-time">${formatMinutes(colSum.total)}${colSum.untimed > 0 ? ` +${colSum.untimed}` : ''}</span>`
      : '';
    return `
    <div class="col">
      <div class="col-head">
        <span class="col-label ${c.className || ''}">${c.label}</span>
        ${timeBadge}
        <span class="col-count">${buckets[c.key].length}</span>
      </div>
      <div class="col-tasks">
        ${buckets[c.key].map(renderTaskTile).join('') || '<div class="empty">—</div>'}
      </div>
    </div>
  `;
  }).join('');

  bindTaskTileEvents();
}

/* ============================================================
   PRIORITY VIEW
   ============================================================ */
function renderPriority() {
  const introEl = document.getElementById('priorityIntroEl');
  const listEl = document.getElementById('priorityEl');
  if (!introEl || !listEl) return;

  introEl.innerHTML = `Ranked by <code>(commission × close% ) ÷ days until due</code> — expected dollars per day of runway. ` +
    `Deal value and close probability come from each task's project; loose and personal tasks rank on urgency alone.`;

  // Score every open task in the current category filter
  const open = visibleTasks().filter(t => t.Status !== 'completed');
  if (open.length === 0) {
    listEl.innerHTML = `<div class="empty-board"><h3>No open tasks to rank.</h3><p>Add some tasks and they'll be prioritized here.</p></div>`;
    return;
  }

  const scored = open.map(scoreTask).sort((a, b) => b.score - a.score);

  // Split into deal-weighted vs urgency-only for a cleaner read
  const dealTasks = scored.filter(s => s.hasMoneyData);
  const looseTasks = scored.filter(s => !s.hasMoneyData);

  let html = '';
  let rank = 0;

  if (dealTasks.length) {
    html += `<div class="priority-section-label">Deal-weighted tasks</div>`;
    html += dealTasks.map(s => { rank++; return priorityRow(s, rank); }).join('');
  }
  if (looseTasks.length) {
    html += `<div class="priority-section-label">Other tasks — urgency only</div>`;
    html += looseTasks.map(s => { rank++; return priorityRow(s, rank); }).join('');
  }

  listEl.innerHTML = html;

  // Bind interactions via the shared, guarded binder (prevents double-binding
  // when a later document-wide bindTaskTileEvents() pass runs)
  bindTaskTileEvents(listEl);
}

/* ============================================================
   TO-DO LIST VIEW — curated shortlist with prioritization
   ============================================================ */
function renderTodo() {
  const controlsEl = document.getElementById('todoControlsEl');
  const totalsEl = document.getElementById('todoTotalsEl');
  const breakdownsEl = document.getElementById('todoBreakdownsEl');
  const listEl = document.getElementById('todoListEl');
  if (!controlsEl || !totalsEl || !breakdownsEl || !listEl) return;

  // Filter by category master filter, then by OnTodoList flag, then by open status
  const todoTasks = visibleTasks()
    .filter(t => t.Status !== 'completed' && t.OnTodoList);

  // Controls (sort toggle + clear all)
  controlsEl.innerHTML = `
    <div class="seg" id="todoSortSeg">
      <button data-sort="auto" class="${state.todoSort === 'auto' ? 'active' : ''}">Auto-sort</button>
      <button data-sort="manual" class="${state.todoSort === 'manual' ? 'active' : ''}">Manual order</button>
    </div>
    <div class="flex-spacer"></div>
    ${todoTasks.length ? `<button class="todo-clear-btn" id="todoClearBtn">Clear all</button>` : ''}
  `;
  controlsEl.querySelectorAll('#todoSortSeg button').forEach(b => {
    b.addEventListener('click', () => {
      state.todoSort = b.dataset.sort;
      localStorage.setItem('brick_todo_sort', state.todoSort);
      renderTodo();
    });
  });
  const clearBtn = document.getElementById('todoClearBtn');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      openConfirm({
        title: 'Clear the to-do list?',
        message: `All ${todoTasks.length} task${todoTasks.length === 1 ? '' : 's'} will be removed from the list.`,
        detail: 'The tasks themselves are not deleted — they stay on the Board.',
        confirmLabel: 'Clear all',
        danger: true,
        onConfirm: async () => {
          await api('clearTodo');
          await refresh();
        }
      });
    });
  }

  if (todoTasks.length === 0) {
    totalsEl.innerHTML = '';
    breakdownsEl.innerHTML = '';
    listEl.innerHTML = `<div class="empty-board">
      <h3>Nothing on your to-do list.</h3>
      <p>Star a task from the Board, Priority, or Urgency view to add it here.</p>
    </div>`;
    return;
  }

  // ===== Totals & breakdowns =====
  const totalMin = todoTasks.reduce((s, t) => s + (parseInt(t.Minutes, 10) || 0), 0);
  const workMin = todoTasks.filter(t => normalizeCategory(t.Category) === 'work')
    .reduce((s, t) => s + (parseInt(t.Minutes, 10) || 0), 0);
  const personalMin = todoTasks.filter(t => normalizeCategory(t.Category) === 'personal')
    .reduce((s, t) => s + (parseInt(t.Minutes, 10) || 0), 0);
  const untimedCount = todoTasks.filter(t => !parseInt(t.Minutes, 10)).length;

  const totalCard = (cls, label, mins) => `
    <div class="total-card ${cls}">
      <div class="total-stack">
        <span class="total-label">${label}</span>
        <span class="total-value">${formatMinutes(mins)}</span>
      </div>
    </div>`;
  totalsEl.innerHTML =
    totalCard('all', `Total (${todoTasks.length} task${todoTasks.length === 1 ? '' : 's'})`, totalMin) +
    totalCard('work', 'Work', workMin) +
    totalCard('personal', 'Personal', personalMin);

  // ===== Breakdowns: by project, by category =====
  const byProject = new Map();
  todoTasks.forEach(t => {
    const pid = t.ProjectID || '__none__';
    if (!byProject.has(pid)) byProject.set(pid, { minutes: 0, count: 0 });
    const rec = byProject.get(pid);
    rec.minutes += parseInt(t.Minutes, 10) || 0;
    rec.count += 1;
  });
  const projectRows = [...byProject.entries()].map(([pid, rec]) => {
    const project = state.projects.find(p => p.ProjectID === pid);
    return {
      name: pid === '__none__' ? 'No project' : (project ? project.ProjectName : 'Unknown project'),
      minutes: rec.minutes, count: rec.count
    };
  }).sort((a, b) => b.minutes - a.minutes);

  const catRows = [
    { name: 'Work',     count: todoTasks.filter(t => normalizeCategory(t.Category) === 'work').length,     minutes: workMin },
    { name: 'Personal', count: todoTasks.filter(t => normalizeCategory(t.Category) === 'personal').length, minutes: personalMin }
  ].filter(r => r.count > 0);

  breakdownsEl.innerHTML = `
    <div class="breakdown-card">
      <h4>By project</h4>
      ${projectRows.map(r => `
        <div class="breakdown-row">
          <span class="label">${escapeHtml(r.name)} <span style="color:var(--ink-faint);font-size:11px;">· ${r.count}</span></span>
          <span class="value">${formatMinutes(r.minutes)}</span>
        </div>
      `).join('')}
    </div>
    <div class="breakdown-card">
      <h4>By category</h4>
      ${catRows.map(r => `
        <div class="breakdown-row">
          <span class="label">${escapeHtml(r.name)} <span style="color:var(--ink-faint);font-size:11px;">· ${r.count}</span></span>
          <span class="value">${formatMinutes(r.minutes)}</span>
        </div>
      `).join('')}
      ${untimedCount ? `<div class="breakdown-row"><span class="label" style="color:var(--ink-faint);">Untimed</span><span class="value">${untimedCount}</span></div>` : ''}
    </div>
  `;

  // ===== The list =====
  let sorted;
  if (state.todoSort === 'manual') {
    sorted = todoTasks.slice().sort((a, b) => (parseInt(a.TodoOrder, 10) || 0) - (parseInt(b.TodoOrder, 10) || 0));
  } else {
    // Score by same formula as Priority view, descending
    sorted = todoTasks.map(scoreTask).sort((a, b) => b.score - a.score).map(s => s.task);
  }

  listEl.innerHTML = sorted.map((t, i) => {
    const s = scoreTask(t);
    const cat = normalizeCategory(t.Category) || 'work';
    const due = t.DueDate ? new Date(t.DueDate) : null;
    let dueLabel = 'no due date';
    let dueClass = '';
    if (due && !isNaN(due)) {
      dueLabel = formatShortDate(due);
      if (s.days <= 0) dueClass = 'overdue';
    }
    const isManual = state.todoSort === 'manual';
    return `
      <div class="priority-row cat-${cat}" ${isManual ? 'draggable="true"' : ''} data-id="${escapeAttr(t.TaskID)}">
        <div class="priority-rank">${i + 1}</div>
        <span class="priority-check" data-action="toggle" data-id="${escapeAttr(t.TaskID)}"></span>
        <div class="priority-main">
          <span class="priority-name" data-action="edit" data-id="${escapeAttr(t.TaskID)}">${escapeHtml(t.TaskName)}</span>
          <div class="priority-sub">
            ${s.project ? `<span class="task-pill project">${escapeHtml(s.project.ProjectName)}</span>` : '<span class="task-pill">no project</span>'}
            <span class="task-pill due ${dueClass}">${dueLabel}</span>
            ${t.Minutes ? `<span>${t.Minutes} min</span>` : ''}
          </div>
        </div>
        <button class="todo-star active" data-action="star" data-id="${escapeAttr(t.TaskID)}" title="Remove from To-Do">★</button>
      </div>
    `;
  }).join('');

  // Bind actions via the shared, guarded binder
  bindTaskTileEvents(listEl);

  // Drag-and-drop for manual sort
  if (state.todoSort === 'manual') {
    bindTodoDnD(listEl);
  }
}

function bindTodoDnD(listEl) {
  let dragEl = null;
  listEl.querySelectorAll('.priority-row').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragEl = row;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.id);
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      listEl.querySelectorAll('.priority-row').forEach(r => r.classList.remove('drop-above', 'drop-below'));
      dragEl = null;
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragEl || row === dragEl) return;
      const rect = row.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      listEl.querySelectorAll('.priority-row').forEach(r => r.classList.remove('drop-above', 'drop-below'));
      row.classList.add(above ? 'drop-above' : 'drop-below');
    });
    row.addEventListener('drop', async e => {
      e.preventDefault();
      if (!dragEl || row === dragEl) return;
      const rect = row.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      // Rebuild order
      const ids = Array.from(listEl.querySelectorAll('.priority-row')).map(r => r.dataset.id);
      const dragId = dragEl.dataset.id;
      const filtered = ids.filter(id => id !== dragId);
      const refIdx = filtered.indexOf(row.dataset.id);
      const insertAt = above ? refIdx : refIdx + 1;
      const newOrder = [...filtered.slice(0, insertAt), dragId, ...filtered.slice(insertAt)];
      // Assign spaced-out TodoOrder values
      const updates = newOrder.map((id, i) => ({ taskId: id, todoOrder: (i + 1) * 1000 }));
      // Optimistic
      updates.forEach(u => {
        const t = state.tasks.find(x => x.TaskID === u.taskId);
        if (t) t.TodoOrder = u.todoOrder;
      });
      renderTodo();
      try {
        await api('reorderTodo', { order: JSON.stringify(updates) });
      } catch (err) {
        alert('Could not save order: ' + err.message);
        await refresh();
      }
    });
  });
}

function priorityRow(s, rank) {
  const t = s.task;
  const cat = normalizeCategory(t.Category) || 'work';
  const due = t.DueDate ? new Date(t.DueDate) : null;
  let dueLabel = 'no due date';
  let dueClass = '';
  if (due && !isNaN(due)) {
    dueLabel = formatShortDate(due);
    if (s.days <= 0) dueClass = 'overdue';
  }
  const daysLabel = !t.DueDate ? '—' : (s.days === 1 ? '1 day' : s.days + ' days');

  let scoreDisplay, formula;
  if (s.hasMoneyData) {
    scoreDisplay = Math.round(s.score).toLocaleString();
    formula = `$${Math.round(s.expectedValue).toLocaleString()} EV ÷ ${daysLabel}`;
  } else {
    scoreDisplay = s.score.toFixed(3);
    formula = `urgency only ÷ ${daysLabel}`;
  }

  return `
    <div class="priority-row cat-${cat}">
      <div class="priority-rank">${rank}</div>
      <span class="priority-check" data-action="toggle" data-id="${escapeAttr(t.TaskID)}"></span>
      <div class="priority-main">
        <span class="priority-name" data-action="edit" data-id="${escapeAttr(t.TaskID)}">${escapeHtml(t.TaskName)}</span>
        <div class="priority-sub">
          ${s.project ? `<span class="task-pill project">${escapeHtml(s.project.ProjectName)}</span>` : '<span class="task-pill">no project</span>'}
          <span class="task-pill due ${dueClass}">${dueLabel}</span>
          ${s.hasMoneyData ? `<span>$${s.commission.toLocaleString()} @ ${s.probability}%</span>` : ''}
          ${t.Minutes ? `<span>${t.Minutes} min</span>` : ''}
        </div>
      </div>
      <div class="priority-score-box">
        <div class="priority-score">${scoreDisplay}</div>
        <div class="priority-formula">${formula}</div>
      </div>
      <button class="todo-star ${t.OnTodoList ? 'active' : ''}" data-action="star" data-id="${escapeAttr(t.TaskID)}" title="${t.OnTodoList ? 'Remove from To-Do' : 'Add to To-Do'}">${t.OnTodoList ? '★' : '☆'}</button>
    </div>
  `;
}

/* ============================================================
   DONE VIEW — completed tasks by day or week
   ============================================================ */
function taskLoggedMinutes(t) {
  const actual = parseInt(t.ActualMinutes, 10);
  if (actual && !isNaN(actual)) return actual;
  const planned = parseInt(t.Minutes, 10);
  if (planned && !isNaN(planned)) return planned;
  return 0;
}

function parseDateInput(s) {
  // 'YYYY-MM-DD' → local Date at midnight
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function weekBounds(anchor) {
  // Sunday–Saturday week containing the anchor date
  const start = startOfDay(anchor);
  start.setDate(start.getDate() - start.getDay());
  const end = new Date(start);
  end.setDate(end.getDate() + 7); // exclusive
  return { start, end };
}

function doneRange() {
  const anchor = parseDateInput(state.doneDate);
  if (state.doneMode === 'week') return weekBounds(anchor);
  const start = startOfDay(anchor);
  const end = new Date(start);
  end.setDate(end.getDate() + 1); // exclusive
  return { start, end };
}

function completedInRange() {
  const { start, end } = doneRange();
  // Merge live + archived tasks so lookback works past the 30-day archival window
  const all = state.tasks.concat(state.archivedTasks || []);
  return all.filter(t => {
    if (t.Status !== 'completed' || !t.CompletedDate) return false;
    if (state.category !== 'all' && normalizeCategory(t.Category) !== state.category) return false;
    const cd = new Date(t.CompletedDate);
    if (isNaN(cd)) return false;
    return cd >= start && cd < end;
  }).sort((a, b) => new Date(b.CompletedDate) - new Date(a.CompletedDate));
}

function renderDone() {
  const controlsEl = document.getElementById('doneControlsEl');
  const summaryEl = document.getElementById('doneSummaryEl');
  const listEl = document.getElementById('doneEl');
  if (!controlsEl || !summaryEl || !listEl) return;

  if (!state.doneDate) state.doneDate = toDateInput(new Date());

  const { start, end } = doneRange();
  const isDay = state.doneMode === 'day';
  const endInclusive = new Date(end); endInclusive.setDate(endInclusive.getDate() - 1);
  const rangeLabel = isDay
    ? (state.doneDate === toDateInput(new Date()) ? 'Today' : formatShortDate(start))
    : `${formatShortDate(start)} – ${formatShortDate(endInclusive)}`;

  controlsEl.innerHTML = `
    <div class="seg" id="doneModeSeg">
      <button data-mode="day" class="${isDay ? 'active' : ''}">Day</button>
      <button data-mode="week" class="${!isDay ? 'active' : ''}">Week</button>
    </div>
    <button class="done-nav-btn" id="donePrev">‹</button>
    <input type="date" id="doneDateInput" value="${state.doneDate}" />
    <button class="done-nav-btn" id="doneNext">›</button>
    <button class="done-nav-btn" id="doneToday">Today</button>
    <div class="seg" id="doneGroupSeg">
      <button data-group="time" class="${state.doneGroup === 'time' ? 'active' : ''}">Timeline</button>
      <button data-group="project" class="${state.doneGroup === 'project' ? 'active' : ''}">By project</button>
    </div>
    <span class="done-range-label">${rangeLabel}</span>
  `;

  // Bind controls
  controlsEl.querySelectorAll('#doneModeSeg button').forEach(b => {
    b.addEventListener('click', () => { state.doneMode = b.dataset.mode; renderDone(); });
  });
  controlsEl.querySelectorAll('#doneGroupSeg button').forEach(b => {
    b.addEventListener('click', () => { state.doneGroup = b.dataset.group; renderDone(); });
  });
  controlsEl.querySelector('#doneDateInput').addEventListener('change', e => {
    if (e.target.value) { state.doneDate = e.target.value; renderDone(); }
  });
  const shiftDays = isDay ? 1 : 7;
  controlsEl.querySelector('#donePrev').addEventListener('click', () => {
    const d = parseDateInput(state.doneDate); d.setDate(d.getDate() - shiftDays);
    state.doneDate = toDateInput(d); renderDone();
  });
  controlsEl.querySelector('#doneNext').addEventListener('click', () => {
    const d = parseDateInput(state.doneDate); d.setDate(d.getDate() + shiftDays);
    state.doneDate = toDateInput(d); renderDone();
  });
  controlsEl.querySelector('#doneToday').addEventListener('click', () => {
    state.doneDate = toDateInput(new Date()); renderDone();
  });

  // Data
  const doneTasks = completedInRange();
  const totalMin = doneTasks.reduce((s, t) => s + taskLoggedMinutes(t), 0);

  summaryEl.innerHTML = `
    <span class="big">${doneTasks.length} task${doneTasks.length === 1 ? '' : 's'}</span>
    <span class="big">${formatMinutes(totalMin)}</span>
    <span class="sub">completed ${isDay ? 'this day' : 'this week'}${state.category !== 'all' ? ` · ${state.category} only` : ''}</span>
  `;

  if (doneTasks.length === 0) {
    listEl.innerHTML = `<div class="empty-board"><h3>Nothing completed ${isDay ? 'on this day' : 'this week'}.</h3></div>`;
    return;
  }

  if (state.doneGroup === 'project') {
    // Group by project, totals per group, sorted by total time desc
    const groups = new Map();
    doneTasks.forEach(t => {
      const key = t.ProjectID || '__none__';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    });
    const sorted = [...groups.entries()].map(([key, tasks]) => {
      const project = state.projects.find(p => p.ProjectID === key)
        || (state.archivedProjects || []).find(p => p.ProjectID === key);
      return {
        name: key === '__none__' ? 'No project' : (project ? project.ProjectName : 'Unknown project'),
        tasks,
        total: tasks.reduce((s, t) => s + taskLoggedMinutes(t), 0)
      };
    }).sort((a, b) => b.total - a.total);

    listEl.innerHTML = sorted.map(g => `
      <div class="done-group-head">
        <span class="done-group-name">${escapeHtml(g.name)}</span>
        <span class="done-group-total">${g.tasks.length} task${g.tasks.length === 1 ? '' : 's'} · ${formatMinutes(g.total)}</span>
      </div>
      ${g.tasks.map(t => doneRow(t, isDay)).join('')}
    `).join('');
  } else {
    listEl.innerHTML = doneTasks.map(t => doneRow(t, isDay)).join('');
  }
}

function doneRow(t, isDay) {
  const cat = normalizeCategory(t.Category) || 'work';
  const project = state.projects.find(p => p.ProjectID === t.ProjectID)
    || (state.archivedProjects || []).find(p => p.ProjectID === t.ProjectID);
  const cd = new Date(t.CompletedDate);
  const timeLabel = isNaN(cd) ? '' : (isDay
    ? cd.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : `${formatShortDate(cd)} ${cd.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`);
  const mins = taskLoggedMinutes(t);
  return `
    <div class="done-row cat-${cat}">
      <span class="done-check">✓</span>
      <span class="done-name">${escapeHtml(t.TaskName)}</span>
      <div class="done-meta">
        ${project && state.doneGroup !== 'project' ? `<span class="task-pill project">${escapeHtml(project.ProjectName)}</span>` : ''}
        ${mins ? `<span>${formatMinutes(mins)}</span>` : ''}
        <span>${timeLabel}</span>
      </div>
    </div>
  `;
}

/* ============================================================
   PROJECTS VIEW
   ============================================================ */
function expectedCommission(p) {
  const c = parseFloat(p.Commission) || 0;
  const prob = parseFloat(p.CloseProbability) || 0;
  return c * (prob / 100);
}

function renderProjects() {
  const el = document.getElementById('projectsEl');
  const showing = state.projectStatusFilter; // 'active' | 'completed'

  let projects = visibleProjects().filter(p =>
    showing === 'completed' ? p.Status === 'completed' : p.Status !== 'completed'
  );

  if (showing === 'completed') {
    // Newest completed first
    projects.sort((a, b) => {
      const da = new Date(a.CompletedDate || 0);
      const db = new Date(b.CompletedDate || 0);
      return db - da;
    });
  } else {
    // Active: auto-sort by expected commission, descending
    projects.sort((a, b) => expectedCommission(b) - expectedCommission(a));
  }

  const cards = projects.map(p => {
    const cat = normalizeCategory(p.Category) || 'work';
    const projectTasks = state.tasks.filter(t => t.ProjectID === p.ProjectID);
    const done = projectTasks.filter(t => t.Status === 'completed');
    const open = projectTasks.filter(t => t.Status !== 'completed');
    const pct = projectTasks.length === 0 ? 0 : Math.round(done.length / projectTasks.length * 100);
    const totalActual = projectTasks.reduce((s, t) => s + (parseInt(t.ActualMinutes, 10) || 0), 0);
    const totalPlanned = open.reduce((s, t) => s + (parseInt(t.Minutes, 10) || 0), 0);
    const isCompleted = p.Status === 'completed';

    // Section expansion state (per section, per project)
    const openKey = `${p.ProjectID}:open`;
    const doneKey = `${p.ProjectID}:completed`;
    // If the user has explicitly toggled a section, the set has an entry for it.
    // "userToggled" flips whichever default that section normally uses.
    const openToggled = state.expandedSections.has(openKey);
    const doneToggled = state.expandedSections.has(doneKey);
    const openExpanded = openToggled ? false : true;   // default open, toggle collapses
    const doneExpanded = doneToggled ? true : false;   // default collapsed, toggle expands

    const commission = parseFloat(p.Commission) || 0;
    const probability = parseFloat(p.CloseProbability) || 0;
    const ev = expectedCommission(p);
    const moneyRow = commission > 0
      ? `<div class="project-money">
           <span class="ev">$${Math.round(ev).toLocaleString()}</span>
           <span class="raw">expected · $${commission.toLocaleString()} @ ${probability}%</span>
         </div>`
      : `<div class="project-money"><span class="raw">no deal value set</span></div>`;

    const actions = isCompleted
      ? `<button data-action="restoreProject" data-id="${escapeAttr(p.ProjectID)}" title="Restore to active">↩</button>
         <button data-action="deleteProject" data-id="${escapeAttr(p.ProjectID)}" title="Delete">×</button>`
      : `<button data-action="editProject" data-id="${escapeAttr(p.ProjectID)}" title="Edit">✎</button>
         <button data-action="completeProject" data-id="${escapeAttr(p.ProjectID)}" title="Mark complete">✓</button>
         <button data-action="deleteProject" data-id="${escapeAttr(p.ProjectID)}" title="Delete">×</button>`;

    // Sort open tasks by SortOrder ascending; completed tasks by CompletedDate descending (newest first)
    const openSorted = open.slice().sort((a, b) => (parseInt(a.SortOrder, 10) || 0) - (parseInt(b.SortOrder, 10) || 0));
    const doneSorted = done.slice().sort((a, b) => {
      const da = new Date(a.CompletedDate || 0);
      const db = new Date(b.CompletedDate || 0);
      return db - da;
    });

    const openSection = open.length > 0 ? `
      <button class="project-tasks-toggle ${openExpanded ? 'open' : ''}" data-action="toggleSection" data-key="${escapeAttr(openKey)}">
        <span class="toggle-label">Open tasks</span>
        <span class="toggle-count">${open.length}</span>
      </button>
      <div class="project-tasks ${openExpanded ? 'open' : ''}">
        ${openSorted.map(renderTaskTile).join('')}
      </div>
    ` : '';

    const doneSection = done.length > 0 ? `
      <button class="project-tasks-toggle completed-section ${doneExpanded ? 'open' : ''}" data-action="toggleSection" data-key="${escapeAttr(doneKey)}">
        <span class="toggle-label">Completed</span>
        <span class="toggle-count">${done.length}</span>
      </button>
      <div class="project-tasks ${doneExpanded ? 'open' : ''}">
        ${doneSorted.map(renderTaskTile).join('')}
      </div>
    ` : '';

    const emptyNote = projectTasks.length === 0
      ? `<div class="empty" style="padding:14px 4px;">No tasks yet</div>`
      : '';

    return `
      <div class="project-card cat-${cat}">
        <div class="project-head">
          <div>
            <div class="project-cat-label">${cat}${isCompleted ? ' · completed' : ''}</div>
            <h3 class="project-name">${escapeHtml(p.ProjectName)}</h3>
          </div>
          <div class="project-actions">${actions}</div>
        </div>
        ${moneyRow}
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-label">${done.length}/${projectTasks.length}</span>
        </div>
        <div class="project-stats">
          <span><strong>${totalPlanned}</strong> min planned</span>
          <span><strong>${totalActual}</strong> min logged</span>
        </div>
        ${openSection}
        ${doneSection}
        ${emptyNote}
      </div>
    `;
  }).join('');

  // "New project" card only on the Active tab
  const newCard = showing === 'active'
    ? `<div class="new-project-card" id="newProjectCard">＋ New project</div>`
    : '';
  const emptyMsg = projects.length === 0
