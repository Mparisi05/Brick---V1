    ? `<div class="empty" style="grid-column:1/-1;padding:40px;">${showing === 'completed' ? 'No completed projects yet.' : ''}</div>`
    : '';
  el.innerHTML = cards + newCard + emptyMsg;

  const npc = document.getElementById('newProjectCard');
  if (npc) npc.addEventListener('click', openNewProjectModal);
  document.querySelectorAll('[data-action="toggleSection"]').forEach(b => {
    b.addEventListener('click', () => {
      const key = b.dataset.key;
      // Presence in the set means "the user has toggled this section away from its default."
      // Open sections: default expanded → toggled = collapsed
      // Completed sections: default collapsed → toggled = expanded
      if (state.expandedSections.has(key)) state.expandedSections.delete(key);
      else state.expandedSections.add(key);
      localStorage.setItem('brick_sections', JSON.stringify([...state.expandedSections]));
      renderProjects();
    });
  });
  document.querySelectorAll('[data-action="editProject"]').forEach(b => {
    b.addEventListener('click', () => {
      const p = state.projects.find(x => x.ProjectID === b.dataset.id);
      if (p) openEditProjectModal(p);
    });
  });
  document.querySelectorAll('[data-action="completeProject"]').forEach(b => {
    b.addEventListener('click', () => {
      const project = state.projects.find(p => p.ProjectID === b.dataset.id);
      openConfirm({
        title: 'Mark project complete?',
        message: project ? `"${project.ProjectName}" will be moved to the Completed tab.` : '',
        confirmLabel: 'Mark complete',
        onConfirm: async () => {
          await api('completeProject', { projectId: b.dataset.id });
          await refresh();
        }
      });
    });
  });
  document.querySelectorAll('[data-action="deleteProject"]').forEach(b => {
    b.addEventListener('click', () => {
      const project = state.projects.find(p => p.ProjectID === b.dataset.id)
        || (state.archivedProjects || []).find(p => p.ProjectID === b.dataset.id);
      openConfirm({
        title: 'Delete this project?',
        message: project ? `"${project.ProjectName}" will be permanently deleted.` : '',
        detail: 'Tasks inside it will be unlinked but not deleted.',
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: async () => {
          await api('deleteProject', { projectId: b.dataset.id });
          await refresh();
        }
      });
    });
  });
  document.querySelectorAll('[data-action="restoreProject"]').forEach(b => {
    b.addEventListener('click', async () => {
      try { await api('updateProject', { projectId: b.dataset.id, status: 'active' }); await refresh(); }
      catch (err) { alert(err.message); }
    });
  });

  bindTaskTileEvents();
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal">${html}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });
  document.addEventListener('keydown', escClose);
}
function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }

/**
 * Show a styled confirmation dialog. Options:
 *   title, message, detail, confirmLabel, danger (bool), onConfirm (async fn)
 */
function openConfirm(opts) {
  const {
    title = 'Are you sure?',
    message = '',
    detail = '',
    confirmLabel = 'Confirm',
    danger = false,
    onConfirm = () => {}
  } = opts;
  openModal(`
    <div class="confirm-modal">
      <h2>${escapeHtml(title)}</h2>
      ${message ? `<p>${escapeHtml(message)}</p>` : ''}
      ${detail ? `<p class="detail">${escapeHtml(detail)}</p>` : ''}
      <div class="modal-actions">
        <button class="secondary" id="conf_cancel">Cancel</button>
        <button class="${danger ? 'danger' : 'primary'}" id="conf_ok">${escapeHtml(confirmLabel)}</button>
      </div>
    </div>
  `);
  document.getElementById('conf_cancel').addEventListener('click', closeModal);
  document.getElementById('conf_ok').addEventListener('click', async () => {
    // Close first so button re-clicks can't fire twice
    closeModal();
    try { await onConfirm(); } catch (err) { alert(err.message); }
  });
  document.getElementById('conf_ok').focus();
}

/* ============================================================
   HELPERS
   ============================================================ */
function normalizeCategory(c) {
  if (!c) return null;
  const lower = c.toString().toLowerCase().trim();
  return (lower === 'work' || lower === 'personal') ? lower : null;
}

function formatMinutes(totalMin) {
  // Always show as hours + minutes, e.g. "3h 45m", "45m", "2h", or "0m"
  const m = parseInt(totalMin, 10);
  if (!m || isNaN(m) || m < 0) return '0m';
  const h = Math.floor(m / 60);
  const rem = m % 60;
  if (h === 0) return `${rem}m`;
  if (rem === 0) return `${h}h`;
  return `${h}h ${rem}m`;
}

function sumOpenMinutes(tasks) {
  // Returns total minutes + count of untimed open tasks
  let total = 0, untimed = 0;
  tasks.forEach(t => {
    if (t.Status === 'completed') return;
    const m = parseInt(t.Minutes, 10);
    if (!m || isNaN(m)) untimed++;
    else total += m;
  });
  return { total, untimed };
}

/* ============================================================
   PRIORITY SCORING ENGINE
   Task score = (Commission × Probability%) ÷ daysUntilDue
   - Commission & Probability come from the task's project
   - daysUntilDue floored at 1; missing due date treated as 365
   - Tasks with no project (loose/personal) have no $ weighting:
     they score on urgency only and sink below deal work
   ============================================================ */
function daysUntilDue(dueStr) {
  if (!dueStr) return 365; // no due date → far horizon
  const d = new Date(dueStr);
  if (isNaN(d)) return 365;
  const today = startOfDay(new Date());
  const due = startOfDay(d);
  const diff = Math.round((due - today) / 86400000);
  return Math.max(diff, 1); // floor at 1 — today/overdue don't divide by zero
}

function scoreTask(t) {
  const project = state.projects.find(p => p.ProjectID === t.ProjectID);
  const days = daysUntilDue(t.DueDate);
  let commission = 0, probability = 0, expectedValue = 0;
  let hasMoneyData = false;

  if (project) {
    commission = parseFloat(project.Commission) || 0;
    probability = parseFloat(project.CloseProbability) || 0;
    if (commission > 0 && probability > 0) {
      expectedValue = commission * (probability / 100);
      hasMoneyData = true;
    }
  }

  // Score: expected $ per day of runway.
  // Loose/no-money tasks get a small urgency-only score so they rank below deal work.
  const score = hasMoneyData ? (expectedValue / days) : (1 / days);

  return {
    task: t,
    project: project || null,
    days,
    commission,
    probability,
    expectedValue,
    hasMoneyData,
    score
  };
}

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0,0,0,0);
  return x;
}

function toDateInput(d) {
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

function formatShortDate(d) {
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[dt.getMonth()]} ${dt.getDate()}`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }
