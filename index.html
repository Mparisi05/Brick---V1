<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brick — time-boxed tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f6f2ec;
    --bg-card:   #ffffff;
    --bg-sunken: #ece6dd;
    --ink:       #1a1715;
    --ink-soft:  #5b524a;
    --ink-faint: #9a8f84;
    --line:      #d9d1c4;
    --line-soft: #e8e1d4;
    --accent:    #b85c38;
    --accent-soft: #e8c2ad;
    --accent-bg:   #f7e6d9;
    --work:      #3d6b8c;
    --work-bg:   #dde8f1;
    --personal:  #6b4a7a;
    --personal-bg: #e6dcec;
    --danger:    #9c2a2a;
    --success:   #3d6b4b;
    --warn:      #b8862a;
    --shadow:    0 1px 2px rgba(26,23,21,0.04), 0 4px 12px rgba(26,23,21,0.06);
    --shadow-lg: 0 4px 16px rgba(26,23,21,0.08), 0 16px 40px rgba(26,23,21,0.10);
    --radius:    10px;
    --radius-sm: 6px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body:    'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* ========= LOGIN ========= */
  .login-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .login-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 40px 36px;
    width: 360px; box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .login-card .brand-mark { margin: 0 auto 20px; }
  .login-card h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 32px; margin: 0 0 6px; letter-spacing: -0.02em;
  }
  .login-card p { color: var(--ink-soft); font-size: 13px; margin: 0 0 24px; }
  .login-card input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg); margin-bottom: 12px;
  }
  .login-card input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .login-card button {
    width: 100%; padding: 11px;
    background: var(--ink); color: var(--bg-card);
    border: none; border-radius: var(--radius-sm);
    font-weight: 600; letter-spacing: 0.01em;
  }
  .login-card button:hover { background: var(--accent); }
  .login-card .err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* ========= APP SHELL ========= */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
    background: var(--bg-card); gap: 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--font-display); font-weight: 600;
    font-size: 22px; letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .brand-mark svg { display: block; }

  .topbar-center { display: flex; align-items: center; gap: 12px; }

  /* Segmented category filter */
  .seg {
    display: inline-flex; background: var(--bg-sunken);
    border-radius: var(--radius-sm); padding: 3px; gap: 2px;
    border: 1px solid var(--line-soft);
  }
  .seg button {
    background: transparent; border: none;
    padding: 6px 14px; border-radius: 4px;
    color: var(--ink-soft); font-weight: 500; font-size: 12px;
    letter-spacing: 0.02em; transition: all 0.15s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.active {
    background: var(--bg-card); color: var(--ink);
    box-shadow: 0 1px 3px rgba(26,23,21,0.08);
  }
  .seg button.active.work     { color: var(--work); }
  .seg button.active.personal { color: var(--personal); }

  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent; border: 1px solid transparent;
    padding: 7px 14px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-weight: 500; font-size: 13px;
  }
  .tab:hover { color: var(--ink); background: var(--bg-sunken); }
  .tab.active { color: var(--ink); background: var(--bg-sunken); border-color: var(--line); }

  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .sync-status { font-size: 11px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .sync-dot.syncing { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .icon-btn {
    background: transparent; border: 1px solid var(--line);
    padding: 6px 10px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-size: 12px;
  }
  .icon-btn:hover { background: var(--bg-sunken); color: var(--ink); }

  /* ========= QUICK ADD ========= */
  .quick-add {
    padding: 16px 24px; background: var(--bg-card);
    border-bottom: 1px solid var(--line);
  }
  .quick-add-row {
    display: flex; gap: 8px; align-items: center;
    max-width: 1200px; margin: 0 auto; flex-wrap: wrap;
  }
  .quick-add input[type="text"] {
    flex: 1; min-width: 220px; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg);
  }
  .quick-add input:focus, .quick-add select:focus {
    outline: 2px solid var(--accent-soft); border-color: var(--accent);
  }
  .quick-add select, .quick-add input[type="date"] {
    padding: 10px 12px; border: 1px solid var(--line);
    border-radius: var(--radius-sm); background: var(--bg); color: var(--ink);
  }
  .qa-seg {
    display: inline-flex; background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px;
  }
  .qa-seg button {
    background: transparent; border: none;
    padding: 6px 12px; border-radius: 4px;
    color: var(--ink-soft); font-weight: 500; font-size: 12px;
  }
  .qa-seg button.active.work     { background: var(--work-bg); color: var(--work); }
  .qa-seg button.active.personal { background: var(--personal-bg); color: var(--personal); }

  .quick-add button.submit {
    padding: 10px 18px; background: var(--accent); color: white;
    border: none; border-radius: var(--radius-sm); font-weight: 600;
  }
  .quick-add button.submit:hover { background: #a04e2e; }
  .quick-add button.submit:disabled { background: var(--ink-faint); cursor: not-allowed; }

  /* ========= MAIN CONTENT ========= */
  .main { flex: 1; overflow: auto; padding: 24px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ========= BOARD / URGENCY GRID ========= */
  .board {
    display: grid;
    grid-template-columns: repeat(7, minmax(160px, 1fr));
    gap: 14px;
  }
  .urgency {
    display: grid;
    grid-template-columns: repeat(5, minmax(200px, 1fr));
    gap: 14px;
  }
  .col {
    background: var(--bg-sunken); border-radius: var(--radius);
    padding: 12px; min-height: 200px;
    border: 1px solid var(--line-soft);
    transition: background 0.15s, border-color 0.15s;
  }
  .col.drag-target { background: var(--accent-bg); border-color: var(--accent); }
  .col-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px; padding: 0 4px;
  }
  .col-label {
    font-family: var(--font-display); font-weight: 600;
    font-size: 15px; color: var(--ink); letter-spacing: -0.01em;
  }
  .urgency .col-label.overdue { color: var(--danger); }
  .urgency .col-label.today   { color: var(--warn); }
  .col-count { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .col-tasks { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }

  /* ========= TASK TILE ========= */
  .task-tile {
    background: var(--bg-card); border-radius: var(--radius-sm);
    padding: 10px 12px; border: 1px solid var(--line);
    cursor: grab; transition: box-shadow 0.12s, border-color 0.12s, opacity 0.12s;
    position: relative;
  }
  .task-tile:hover { box-shadow: var(--shadow); border-color: var(--accent-soft); }
  .task-tile:active { cursor: grabbing; }
  .task-tile.dragging { opacity: 0.35; }
  .task-tile.drop-above { box-shadow: -3px -3px 0 var(--accent) inset, 0 -3px 0 var(--accent); }
  .task-tile.drop-below { box-shadow: 0 3px 0 var(--accent); }
  .task-tile.completed { opacity: 0.55; background: var(--bg); }
  .task-tile.completed .task-name { text-decoration: line-through; color: var(--ink-faint); }
  /* Category accent stripe on left edge */
  .task-tile::before {
    content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 3px; border-radius: 2px;
  }
  .task-tile.cat-work::before     { background: var(--work); }
  .task-tile.cat-personal::before { background: var(--personal); }

  .task-head { display: flex; align-items: flex-start; gap: 8px; padding-left: 8px; }
  .task-check {
    width: 16px; height: 16px; border: 1.5px solid var(--line);
    border-radius: 4px; flex-shrink: 0; margin-top: 2px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-card); cursor: pointer;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-check.checked::after { content: '✓'; color: white; font-size: 11px; line-height: 1; }
  .task-name { font-size: 13px; font-weight: 500; line-height: 1.35; word-break: break-word; flex: 1; cursor: pointer; }
  .task-meta {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 8px; padding-left: 32px;
    font-size: 11px; color: var(--ink-soft);
  }
  .task-pill {
    background: var(--bg-sunken); padding: 2px 7px;
    border-radius: 10px; font-size: 10px; letter-spacing: 0.02em;
  }
  .task-pill.project { background: var(--accent-bg); color: var(--accent); }
  .task-pill.due.overdue { background: #f4d8d8; color: var(--danger); }
  .task-pill.due.today { background: #fbe9c8; color: var(--warn); }

  /* ========= PROJECTS VIEW ========= */
  .projects-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .project-card {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
    box-shadow: var(--shadow); position: relative;
  }
  .project-card::before {
    content: ''; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 2px;
  }
  .project-card.cat-work::before     { background: var(--work); }
  .project-card.cat-personal::before { background: var(--personal); }

  .project-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-left: 8px; }
  .project-name {
    font-family: var(--font-display); font-weight: 600;
    font-size: 19px; letter-spacing: -0.01em; margin: 0;
  }
  .project-cat-label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600;
  }
  .project-actions { display: flex; gap: 4px; }
  .project-actions button {
    background: transparent; border: none; padding: 4px 6px;
    color: var(--ink-faint); border-radius: 4px; font-size: 13px;
  }
  .project-actions button:hover { background: var(--bg-sunken); color: var(--ink); }

  .progress-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; padding-left: 8px; }
  .progress-track { flex: 1; height: 6px; background: var(--bg-sunken); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s ease; }
  .progress-label { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .project-stats {
    display: flex; gap: 14px; font-size: 11px; color: var(--ink-faint);
    margin-bottom: 10px; padding-left: 8px;
  }
  .project-stats strong { color: var(--ink-soft); font-weight: 600; }

  .project-tasks-toggle {
    background: transparent; border: 1px solid var(--line);
    padding: 6px 10px; border-radius: var(--radius-sm);
    color: var(--ink-soft); font-size: 12px; width: 100%;
    text-align: left; margin-top: 8px;
  }
  .project-tasks-toggle:hover { background: var(--bg-sunken); }
  .project-tasks-toggle::before { content: '▸ '; transition: transform 0.2s; display: inline-block; }
  .project-tasks-toggle.open::before { transform: rotate(90deg); }

  .project-tasks { margin-top: 10px; display: none; }
  .project-tasks.open { display: flex; flex-direction: column; gap: 6px; }
  .project-tasks .task-tile { cursor: default; }

  .new-project-card {
    background: transparent; border: 1.5px dashed var(--line);
    border-radius: var(--radius); padding: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-faint); font-size: 13px;
    min-height: 140px; cursor: pointer; transition: all 0.15s;
  }
  .new-project-card:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  /* ========= MODAL ========= */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(26,23,21,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 500; animation: fadein 0.15s;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-card); border-radius: var(--radius);
    padding: 28px; width: 440px; max-width: 90vw;
    box-shadow: var(--shadow-lg);
  }
  .modal h2 {
    font-family: var(--font-display); font-weight: 600;
    margin: 0 0 18px; font-size: 22px; letter-spacing: -0.01em;
  }
  .modal p.hint { color: var(--ink-soft); font-size: 13px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; color: var(--ink-soft);
    margin-bottom: 5px; font-weight: 500; letter-spacing: 0.02em;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px;
  }
  .modal-actions button {
    padding: 9px 18px; border-radius: var(--radius-sm);
    font-weight: 600; border: 1px solid var(--line); background: var(--bg-card);
  }
  .modal-actions button.primary {
    background: var(--ink); color: var(--bg-card); border-color: var(--ink);
  }
  .modal-actions button.primary:hover { background: var(--accent); border-color: var(--accent); }
  .modal-actions button.danger { background: var(--danger); color: white; border-color: var(--danger); }
  .modal-actions button.secondary:hover { background: var(--bg-sunken); }

  /* ========= EMPTY STATES ========= */
  .empty { text-align: center; padding: 20px; color: var(--ink-faint); font-size: 12px; }
  .empty-board {
    grid-column: 1 / -1; text-align: center;
    padding: 60px 20px; color: var(--ink-faint);
  }
  .empty-board h3 {
    font-family: var(--font-display); font-weight: 500;
    font-size: 20px; color: var(--ink-soft); margin: 0 0 8px;
  }

  /* ========= RESPONSIVE ========= */
  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .urgency { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  }
  @media (max-width: 700px) {
    .topbar { padding: 10px 14px; flex-wrap: wrap; gap: 8px; }
    .brand { font-size: 18px; }
    .topbar-center { width: 100%; flex-wrap: wrap; justify-content: center; }
    .tabs { order: 3; width: 100%; justify-content: center; }
    .quick-add { padding: 12px 14px; }
    .quick-add-row { gap: 6px; }
    .main { padding: 14px; }
    .board, .urgency { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark" style="width:44px;height:44px;">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="22" width="16" height="10" rx="2" fill="#b85c38"/>
        <rect x="22" y="22" width="10" height="10" rx="2" fill="#1a1715"/>
        <rect x="4" y="10" width="10" height="10" rx="2" fill="#1a1715"/>
        <rect x="16" y="10" width="22" height="10" rx="2" fill="#b85c38"/>
      </svg>
    </div>
    <h1>Brick</h1>
    <p>Time-boxed tasks, stacked.</p>
    <input id="passcodeInput" type="password" placeholder="Enter passcode" autocomplete="off" />
    <button id="loginBtn">Enter</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="app" style="display:none;">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="22" width="16" height="10" rx="2" fill="#b85c38"/>
          <rect x="22" y="22" width="10" height="10" rx="2" fill="#1a1715"/>
          <rect x="4" y="10" width="10" height="10" rx="2" fill="#1a1715"/>
          <rect x="16" y="10" width="22" height="10" rx="2" fill="#b85c38"/>
        </svg>
      </span>
      Brick
    </div>

    <div class="topbar-center">
      <div class="seg" id="categoryFilter">
        <button data-cat="all" class="active">All</button>
        <button data-cat="work">Work</button>
        <button data-cat="personal">Personal</button>
      </div>
      <nav class="tabs">
        <button class="tab active" data-view="board">Board</button>
        <button class="tab" data-view="urgency">Urgency</button>
        <button class="tab" data-view="projects">Projects</button>
      </nav>
    </div>

    <div class="topbar-right">
      <div class="sync-status">
        <span id="syncDot" class="sync-dot"></span>
        <span id="syncText">Synced</span>
      </div>
      <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
      <button class="icon-btn" id="logoutBtn" title="Log out">⏻</button>
    </div>
  </header>

  <section class="quick-add">
    <div class="quick-add-row">
      <input type="text" id="qaName" placeholder="Add a task and press Enter…" />
      <div class="qa-seg" id="qaCategory">
        <button data-cat="work" class="active work">Work</button>
        <button data-cat="personal" class="personal">Personal</button>
      </div>
      <select id="qaMinutes" title="Time">
        <option value="">No time</option>
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
        <option value="120">2 hr (splits)</option>
        <option value="180">3 hr (splits)</option>
        <option value="240">4 hr (splits)</option>
      </select>
      <select id="qaProject" title="Project">
        <option value="">No project</option>
      </select>
      <input type="date" id="qaDue" title="Due date" />
      <button class="submit" id="qaSubmit">Add</button>
    </div>
  </section>

  <main class="main">
    <section id="view-board" class="view active"><div class="board" id="boardEl"></div></section>
    <section id="view-urgency" class="view"><div class="urgency" id="urgencyEl"></div></section>
    <section id="view-projects" class="view"><div class="projects-grid" id="projectsEl"></div></section>
  </main>
</div>

<div id="modalRoot"></div>

<script>
/* ============================================================
   CONFIG — set this to your deployed Apps Script Web App URL
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxz_NetuDdkLXtbWobSPQ75q3lbCc5iq7Kz0AZzBTVTpoTeBjDFWHTUUPm7MZhqauI8/exec';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  tasks: [],
  projects: [],
  archivedTasks: [],
  archivedProjects: [],
  view: 'board',
  category: localStorage.getItem('brick_category') || 'all',     // all | work | personal
  qaCategory: localStorage.getItem('brick_qa_category') || 'work', // default for new tasks
  passcode: localStorage.getItem('brick_passcode') || '',
  expandedProjects: new Set(JSON.parse(localStorage.getItem('brick_expanded') || '[]'))
};

const BUCKETS = [null, 5, 10, 15, 30, 60, 90];
const BUCKET_LABELS = { 'null': 'Unsized', '5': '5 min', '10': '10 min', '15': '15 min', '30': '30 min', '60': '60 min', '90': '90 min' };

/* ============================================================
   API
   ============================================================ */
async function api(action, params = {}) {
  setSync('syncing');
  try {
    const body = new URLSearchParams({ action, passcode: state.passcode, ...params });
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString(),
      redirect: 'follow'
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Unknown error');
    setSync('synced');
    return json.data;
  } catch (err) {
    setSync('error', err.message);
    throw err;
  }
}

function setSync(status, msg) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if (!dot || !txt) return;
  dot.classList.remove('syncing', 'error');
  if (status === 'syncing') { dot.classList.add('syncing'); txt.textContent = 'Syncing…'; }
  else if (status === 'error') { dot.classList.add('error'); txt.textContent = 'Error'; txt.title = msg || ''; }
  else { txt.textContent = 'Synced'; txt.title = ''; }
}

/* ============================================================
   LOGIN
   ============================================================ */
function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('passcodeInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') tryLogin();
});

async function tryLogin() {
  const code = document.getElementById('passcodeInput').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if (!code) { errEl.textContent = 'Enter a passcode.'; return; }
  state.passcode = code;
  try {
    await api('list');
    localStorage.setItem('brick_passcode', code);
    showApp();
    await refresh();
  } catch (err) {
    state.passcode = '';
    errEl.textContent = err.message.includes('Unauthorized') ? 'Wrong passcode.' : err.message;
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('brick_passcode');
  state.passcode = '';
  showLogin();
});

async function refresh() {
  const data = await api('list');
  state.tasks = data.tasks || [];
  state.projects = data.projects || [];
  state.archivedTasks = data.archivedTasks || [];
  state.archivedProjects = data.archivedProjects || [];
  renderAll();
}

  applyCategoryClassToBody();
  renderProjectSelect();
  renderBoard();
  renderUrgency();

}

function applyCategoryClassToBody() {
  document.querySelectorAll('#categoryFilter button').forEach(b => {

    b.classList.toggle('work', b.dataset.cat === 'work' && b.classList.contains('active'));
    b.classList.toggle('personal', b.dataset.cat === 'personal' && b.classList.contains('active'));

}

document.getElementById('refreshBtn').addEventListener('click', refresh);

async function quickAdd() {
  const name = document.getElementById('qaName').value.trim();
  if (!name) return;
  const minutes = document.getElementById('qaMinutes').value;
  const projectId = document.getElementById('qaProject').value;
  const dueDate = document.getElementById('qaDue').value;
  const category = state.qaCategory;

  const btn = document.getElementById('qaSubmit');
  btn.disabled = true;
  try {
    await api('addTask', { taskName: name, category, minutes, projectId, dueDate });
    document.getElementById('qaName').value = '';
    document.getElementById('qaMinutes').value = '';
    document.getElementById('qaDue').value = '';

    document.getElementById('qaName').focus();

  } finally {

  }

/* ============================================================
   BOARD VIEW (time buckets)
   ============================================================ */
function renderBoard() {
  const el = document.getElementById('boardEl');
  const tasks = visibleTasks();

  if (tasks.length === 0) {
    el.innerHTML = `<div class="empty-board">
      <h3>Nothing here yet.</h3>
      <p>Add a task above to get started${state.category !== 'all' ? ` in <strong>${state.category}</strong>` : ''}.</p>
    </div>`;
    return;
  }

  el.innerHTML = BUCKETS.map(bucket => {
    const inBucket = tasks
      .filter(t => taskBucket(t) === bucket)
      .sort((a, b) => (parseInt(a.SortOrder, 10) || 0) - (parseInt(b.SortOrder, 10) || 0));
    const openInBucket = inBucket.filter(t => t.Status !== 'completed');
    return `
      <div class="col" data-bucket="${bucket === null ? '' : bucket}">
        <div class="col-head">
          <span class="col-label">${BUCKET_LABELS[String(bucket)]}</span>
          <span class="col-count">${openInBucket.length}</span>
        </div>
        <div class="col-tasks" data-bucket="${bucket === null ? '' : bucket}">
          ${inBucket.map(renderTaskTile).join('') || '<div class="empty">—</div>'}
        </div>
      </div>
    `;
  }).join('');

  bindTaskTileEvents();
  bindBoardDnD();
}

function taskBucket(t) {
  const m = parseInt(t.Minutes, 10);
  if (!m || isNaN(m)) return null;
  return m;
}

function renderTaskTile(t) {
  const project = state.projects.find(p => p.ProjectID === t.ProjectID);
  const due = t.DueDate ? new Date(t.DueDate) : null;
  let dueClass = '';
  let dueLabel = '';
  if (due && !isNaN(due)) {
    const today = startOfDay(new Date());
    const dueDay = startOfDay(due);
    const diff = (dueDay - today) / 86400000;
    if (diff < 0) dueClass = 'overdue';
    else if (diff === 0) dueClass = 'today';
    dueLabel = formatShortDate(due);
  }
  const completed = t.Status === 'completed';
  const cat = normalizeCategory(t.Category) || 'work';
  return `
    <div class="task-tile cat-${cat} ${completed ? 'completed' : ''}" draggable="true" data-id="${escapeAttr(t.TaskID)}">
      <div class="task-head">
        <span class="task-check ${completed ? 'checked' : ''}" data-action="toggle" data-id="${escapeAttr(t.TaskID)}"></span>
        <span class="task-name" data-action="edit" data-id="${escapeAttr(t.TaskID)}">${escapeHtml(t.TaskName)}</span>
      </div>
      ${(project || dueLabel) ? `
        <div class="task-meta">
          ${project ? `<span class="task-pill project">${escapeHtml(project.ProjectName)}</span>` : ''}
          ${dueLabel ? `<span class="task-pill due ${dueClass}">${dueLabel}</span>` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function bindTaskTileEvents() {
  document.querySelectorAll('[data-action="toggle"]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.id;
      const t = state.tasks.find(x => x.TaskID === id);
      if (!t) return;
      if (t.Status === 'completed') uncompleteTaskFlow(t);
      else completeTaskFlow(t);
    });
  });
  document.querySelectorAll('[data-action="edit"]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.id;
      const t = state.tasks.find(x => x.TaskID === id);
      if (t) openTaskModal(t);
    });
  });
}

/* ============================================================
   DRAG & DROP (Board view only)
   ============================================================ */
let dragId = null;

function bindBoardDnD() {
  document.querySelectorAll('#boardEl .task-tile').forEach(tile => {
    tile.addEventListener('dragstart', e => {
      dragId = tile.dataset.id;
      tile.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });
    tile.addEventListener('dragend', () => {
      tile.classList.remove('dragging');
      document.querySelectorAll('.task-tile').forEach(x => x.classList.remove('drop-above', 'drop-below'));
      document.querySelectorAll('.col').forEach(c => c.classList.remove('drag-target'));
      dragId = null;
    });
    tile.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragId || tile.dataset.id === dragId) return;
      const rect = tile.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      document.querySelectorAll('.task-tile').forEach(x => x.classList.remove('drop-above', 'drop-below'));
      tile.classList.add(above ? 'drop-above' : 'drop-below');
    });
    tile.addEventListener('drop', async e => {
      e.preventDefault();
      e.stopPropagation();
      if (!dragId || tile.dataset.id === dragId) return;
      const rect = tile.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      const targetCol = tile.closest('.col-tasks');
      await handleDrop(dragId, targetCol, tile.dataset.id, above);
    });
  });

  document.querySelectorAll('#boardEl .col-tasks').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      col.closest('.col').classList.add('drag-target');
    });
    col.addEventListener('dragleave', e => {
      // only remove if leaving the column entirely
      if (!col.contains(e.relatedTarget)) col.closest('.col').classList.remove('drag-target');
    });
    col.addEventListener('drop', async e => {
      e.preventDefault();
      col.closest('.col').classList.remove('drag-target');
      // If we dropped on the column itself (not on a tile), append to the end
      if (e.target === col || e.target.classList.contains('empty')) {
        await handleDrop(dragId, col, null, false);
      }
    });
  });
}

async function handleDrop(taskId, targetCol, referenceId, dropAbove) {
  if (!taskId || !targetCol) return;
  const newBucketAttr = targetCol.dataset.bucket;
  const newBucket = newBucketAttr === '' ? null : parseInt(newBucketAttr, 10);

  // Collect target column's current task IDs in display order
  const idsInCol = Array.from(targetCol.querySelectorAll('.task-tile')).map(el => el.dataset.id);
  // Remove the dragged task from this list if it's there (cross-position move within same col)
  const filtered = idsInCol.filter(id => id !== taskId);
  // Insert dragged task at correct position
  let insertAt;
  if (referenceId === null) {
    insertAt = filtered.length; // end of column
  } else {
    const refIdx = filtered.indexOf(referenceId);
    insertAt = refIdx === -1 ? filtered.length : (dropAbove ? refIdx : refIdx + 1);
  }
  const newOrder = [...filtered.slice(0, insertAt), taskId, ...filtered.slice(insertAt)];

  // Generate new SortOrder values (spaced by 1000 to leave room for future inserts)
  const updates = newOrder.map((id, i) => {
    const upd = { taskId: id, sortOrder: (i + 1) * 1000 };
    if (id === taskId) upd.minutes = newBucket === null ? '' : newBucket;
    return upd;
  });

  // Optimistic local update so UI feels instant
  updates.forEach(u => {
    const t = state.tasks.find(x => x.TaskID === u.taskId);
    if (t) {
      t.SortOrder = u.sortOrder;
      if (u.minutes !== undefined) t.Minutes = u.minutes === '' ? '' : u.minutes;
    }
  });
  renderBoard();

  try {
    await api('reorderTasks', { order: JSON.stringify(updates) });
  } catch (err) {
    alert('Could not save new order: ' + err.message);
    await refresh();
  }
}

/* ============================================================
   URGENCY VIEW
   ============================================================ */
function renderUrgency() {
  const el = document.getElementById('urgencyEl');
  const today = startOfDay(new Date());
  const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate() + 7);

  const buckets = { overdue: [], today: [], week: [], later: [], none: [] };
  visibleTasks().filter(t => t.Status !== 'completed').forEach(t => {
    if (!t.DueDate) { buckets.none.push(t); return; }
    const d = new Date(t.DueDate);
    if (isNaN(d)) { buckets.none.push(t); return; }
    const day = startOfDay(d);
    if (day < today) buckets.overdue.push(t);
    else if (day.getTime() === today.getTime()) buckets.today.push(t);
    else if (day <= weekEnd) buckets.week.push(t);
    else buckets.later.push(t);
  });

  Object.keys(buckets).forEach(k => buckets[k].sort((a,b) => {
    const da = new Date(a.DueDate); const db = new Date(b.DueDate);
    return (isNaN(da) ? 0 : da) - (isNaN(db) ? 0 : db);
  }));

  const cols = [
    { key: 'overdue', label: 'Overdue', className: 'overdue' },
    { key: 'today',   label: 'Today',   className: 'today' },
    { key: 'week',    label: 'This Week' },
    { key: 'later',   label: 'Later' },
    { key: 'none',    label: 'No Date' }
  ];

  el.innerHTML = cols.map(c => `
    <div class="col">
      <div class="col-head">
        <span class="col-label ${c.className || ''}">${c.label}</span>
        <span class="col-count">${buckets[c.key].length}</span>
      </div>
      <div class="col-tasks">
        ${buckets[c.key].map(renderTaskTile).join('') || '<div class="empty">—</div>'}
      </div>
    </div>
  `).join('');

  bindTaskTileEvents();
}

/* ============================================================
   PROJECTS VIEW
   ============================================================ */
function renderProjects() {
  const el = document.getElementById('projectsEl');
  const active = visibleProjects().filter(p => p.Status !== 'completed');

  const cards = active.map(p => {
    const cat = normalizeCategory(p.Category) || 'work';
    const projectTasks = state.tasks.filter(t => t.ProjectID === p.ProjectID);
    const done = projectTasks.filter(t => t.Status === 'completed');
    const open = projectTasks.filter(t => t.Status !== 'completed');
    const pct = projectTasks.length === 0 ? 0 : Math.round(done.length / projectTasks.length * 100);
    const totalActual = projectTasks.reduce((s, t) => s + (parseInt(t.ActualMinutes, 10) || 0), 0);
    const totalPlanned = open.reduce((s, t) => s + (parseInt(t.Minutes, 10) || 0), 0);
    const expanded = state.expandedProjects.has(p.ProjectID);

    return `
      <div class="project-card cat-${cat}">
        <div class="project-head">
          <div>
            <div class="project-cat-label">${cat}</div>
            <h3 class="project-name">${escapeHtml(p.ProjectName)}</h3>
          </div>
          <div class="project-actions">
            <button data-action="editProject" data-id="${escapeAttr(p.ProjectID)}" title="Edit">✎</button>
            <button data-action="completeProject" data-id="${escapeAttr(p.ProjectID)}" title="Mark complete">✓</button>
            <button data-action="deleteProject" data-id="${escapeAttr(p.ProjectID)}" title="Delete">×</button>
          </div>
        </div>
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-label">${done.length}/${projectTasks.length}</span>
        </div>
        <div class="project-stats">
          <span><strong>${totalPlanned}</strong> min planned</span>
          <span><strong>${totalActual}</strong> min logged</span>
        </div>
        <button class="project-tasks-toggle ${expanded ? 'open' : ''}" data-action="toggleProject" data-id="${escapeAttr(p.ProjectID)}">
          ${projectTasks.length === 0 ? 'No tasks yet' : (expanded ? 'Hide tasks' : `Show ${projectTasks.length} task${projectTasks.length === 1 ? '' : 's'}`)}
        </button>
        <div class="project-tasks ${expanded ? 'open' : ''}">
          ${projectTasks
            .sort((a, b) => {
              const ac = a.Status === 'completed' ? 1 : 0;
              const bc = b.Status === 'completed' ? 1 : 0;
              if (ac !== bc) return ac - bc;
              return (parseInt(a.SortOrder, 10) || 0) - (parseInt(b.SortOrder, 10) || 0);
            })
            .map(renderTaskTile).join('')}
        </div>
      </div>
    `;
  }).join('');

  el.innerHTML = cards + `<div class="new-project-card" id="newProjectCard">＋ New project</div>`;

  document.getElementById('newProjectCard').addEventListener('click', openNewProjectModal);
  document.querySelectorAll('[data-action="toggleProject"]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.id;
      if (state.expandedProjects.has(id)) state.expandedProjects.delete(id);
      else state.expandedProjects.add(id);
      localStorage.setItem('brick_expanded', JSON.stringify([...state.expandedProjects]));
      renderProjects();
    });
  });
  document.querySelectorAll('[data-action="editProject"]').forEach(b => {
    b.addEventListener('click', () => {
      const p = state.projects.find(x => x.ProjectID === b.dataset.id);
      if (p) openEditProjectModal(p);
    });
  });
  document.querySelectorAll('[data-action="completeProject"]').forEach(b => {
    b.addEventListener('click', async () => {
      if (!confirm('Mark project complete?')) return;
      try { await api('completeProject', { projectId: b.dataset.id }); await refresh(); }
      catch (err) { alert(err.message); }
    });
  });
  document.querySelectorAll('[data-action="deleteProject"]').forEach(b => {
    b.addEventListener('click', async () => {
      if (!confirm('Delete this project? Tasks inside it will be unlinked (not deleted).')) return;
      try { await api('deleteProject', { projectId: b.dataset.id }); await refresh(); }
      catch (err) { alert(err.message); }
    });
  });

  bindTaskTileEvents();
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal">${html}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });
  document.addEventListener('keydown', escClose);
}
function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }

function openTaskModal(t) {
  const taskCat = normalizeCategory(t.Category) || 'work';
  // Project options filtered by the task's current category
  const projOpts = ['<option value="">No project</option>']
    .concat(state.projects
      .filter(p => p.Status !== 'completed')
      .filter(p => normalizeCategory(p.Category) === taskCat)
      .map(p => `<option value="${escapeAttr(p.ProjectID)}" ${p.ProjectID === t.ProjectID ? 'selected' : ''}>${escapeHtml(p.ProjectName)}</option>`))
    .join('');
  const due = t.DueDate ? toDateInput(t.DueDate) : '';
  const inProject = !!t.ProjectID;

  openModal(`
    <h2>Edit task</h2>
    <div class="field"><label>Name</label><input id="m_name" type="text" value="${escapeAttr(t.TaskName)}" /></div>
    <div class="field">
      <label>Category ${inProject ? '<span style="color:var(--ink-faint);font-weight:400;">(inherited from project)</span>' : ''}</label>
      <select id="m_category" ${inProject ? 'disabled' : ''}>
        <option value="work" ${taskCat === 'work' ? 'selected' : ''}>Work</option>
        <option value="personal" ${taskCat === 'personal' ? 'selected' : ''}>Personal</option>
      </select>
    </div>
    <div class="field"><label>Time</label>
      <select id="m_minutes">
        <option value="">No time</option>
        ${[5,10,15,30,60,90].map(m => `<option value="${m}" ${parseInt(t.Minutes,10)===m?'selected':''}>${m} min</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Project</label><select id="m_project">${projOpts}</select></div>
    <div class="field"><label>Due date</label><input id="m_due" type="date" value="${due}" /></div>
    <div class="field"><label>Notes</label><textarea id="m_notes">${escapeHtml(t.Notes || '')}</textarea></div>
    <div class="modal-actions">
      <button class="danger" id="m_delete">Delete</button>
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" id="m_save">Save</button>
    </div>
  `);
  document.getElementById('m_save').addEventListener('click', async () => {
    try {
      await api('updateTask', {
        taskId: t.TaskID,
        taskName: document.getElementById('m_name').value.trim(),
        category: document.getElementById('m_category').value,
        minutes: document.getElementById('m_minutes').value,
        projectId: document.getElementById('m_project').value,
        dueDate: document.getElementById('m_due').value,
        notes: document.getElementById('m_notes').value
      });
      closeModal(); await refresh();
    } catch (err) { alert(err.message); }
  });
  document.getElementById('m_delete').addEventListener('click', async () => {
    if (!confirm('Delete this task?')) return;
    try { await api('deleteTask', { taskId: t.TaskID }); closeModal(); await refresh(); }
    catch (err) { alert(err.message); }
  });
}

function openNewProjectModal() {
  const defaultCat = state.category === 'all' ? state.qaCategory : state.category;
  openModal(`
    <h2>New project</h2>
    <div class="field"><label>Name</label><input id="p_name" type="text" autofocus /></div>
    <div class="field"><label>Category</label>
      <select id="p_category">
        <option value="work" ${defaultCat === 'work' ? 'selected' : ''}>Work</option>
        <option value="personal" ${defaultCat === 'personal' ? 'selected' : ''}>Personal</option>
      </select>
    </div>
    <div class="field"><label>Notes</label><textarea id="p_notes"></textarea></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" id="p_save">Create</button>
    </div>
  `);
  document.getElementById('p_save').addEventListener('click', async () => {
    const name = document.getElementById('p_name').value.trim();
    if (!name) return;
    try {
      await api('addProject', {
        projectName: name,
        category: document.getElementById('p_category').value,
        notes: document.getElementById('p_notes').value
      });
      closeModal(); await refresh();
    } catch (err) { alert(err.message); }
  });
}

function openEditProjectModal(p) {
  const cat = normalizeCategory(p.Category) || 'work';
  openModal(`
    <h2>Edit project</h2>
    <div class="field"><label>Name</label><input id="p_name" type="text" value="${escapeAttr(p.ProjectName)}" /></div>
    <div class="field"><label>Category <span style="color:var(--ink-faint);font-weight:400;">(changes apply to all tasks in this project)</span></label>
      <select id="p_category">
        <option value="work" ${cat === 'work' ? 'selected' : ''}>Work</option>
        <option value="personal" ${cat === 'personal' ? 'selected' : ''}>Personal</option>
      </select>
    </div>
    <div class="field"><label>Notes</label><textarea id="p_notes">${escapeHtml(p.Notes || '')}</textarea></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" id="p_save">Save</button>
    </div>
  `);
  document.getElementById('p_save').addEventListener('click', async () => {
    try {
      await api('updateProject', {
        projectId: p.ProjectID,
        projectName: document.getElementById('p_name').value.trim(),
        category: document.getElementById('p_category').value,
        notes: document.getElementById('p_notes').value
      });
      closeModal(); await refresh();
    } catch (err) { alert(err.message); }
  });
}

/* ============================================================
   COMPLETE / UNCOMPLETE FLOW
   ============================================================ */
async function completeTaskFlow(t) {
  // If task is tied to a project, prompt for actual time
  if (t.ProjectID) {
    openCompleteWithActualModal(t);
  } else {
    try { await api('completeTask', { taskId: t.TaskID }); await refresh(); }
    catch (err) { alert(err.message); }
  }
}

function openCompleteWithActualModal(t) {
  const planned = parseInt(t.Minutes, 10) || '';
  openModal(`
    <h2>Mark complete</h2>
    <p class="hint">How long did this actually take? This adds to the project's time logged.</p>
    <div class="field">
      <label>Actual minutes</label>
      <input id="c_actual" type="number" min="0" value="${planned}" autofocus />
    </div>
    <div class="modal-actions">
      <button class="secondary" id="c_skip">Skip</button>
      <button class="primary" id="c_save">Save & complete</button>
    </div>
  `);
  document.getElementById('c_save').addEventListener('click', async () => {
    try {
      await api('completeTask', { taskId: t.TaskID, actualMinutes: document.getElementById('c_actual').value });
      closeModal(); await refresh();
    } catch (err) { alert(err.message); }
  });
  document.getElementById('c_skip').addEventListener('click', async () => {
    try {
      await api('completeTask', { taskId: t.TaskID });
      closeModal(); await refresh();
    } catch (err) { alert(err.message); }
  });
}

async function uncompleteTaskFlow(t) {
  try { await api('uncompleteTask', { taskId: t.TaskID }); await refresh(); }
  catch (err) { alert(err.message); }
}

/* ============================================================
   HELPERS
   ============================================================ */
function normalizeCategory(c) {
  if (!c) return null;
  const lower = c.toString().toLowerCase().trim();
  return (lower === 'work' || lower === 'personal') ? lower : null;
}

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0,0,0,0);
  return x;
}

function toDateInput(d) {
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

function formatShortDate(d) {
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[dt.getMonth()]} ${dt.getDate()}`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============================================================
   STARTUP
   ============================================================ */
(async function init() {
  applyCategoryClassToBody();
  if (state.passcode) {
    try {
      await api('list');
      showApp();
      await refresh();
    } catch (err) {
      state.passcode = '';
      localStorage.removeItem('brick_passcode');
      showLogin();
    }
  } else {
    showLogin();
  }
})();
</script>
